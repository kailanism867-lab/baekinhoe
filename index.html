}

function openPasteVaccts() {
  const sh = openSheet('전용 입금 계좌 등록', `<p class="hint">은행에서 받은 가상계좌 번호 목록을 붙여 넣으세요.<br>· <b>‘이름 계좌번호’</b> 줄은 그 회원에게 넣습니다.<br>· <b>번호만 있는 줄</b>은 아직 계좌가 없는 회원에게 명단 순서(1조→3조, 조장·반장 먼저)대로 나눠 줍니다.</p>
    <textarea class="tpl-ta" id="vTa" rows="8" placeholder="김진호 562-912345-10001&#10;562-912345-10002&#10;562-912345-10003"></textarea>
    <button class="btn primary block" id="vGo">맞춰 보기</button><div id="vOut"></div>`);
  sh.querySelector('#vGo').onclick = () => {
    const r = parseVaccts(sh.querySelector('#vTa').value, activeMembers(), S.D.members);
    const out = sh.querySelector('#vOut');
    if (!r.items.length) { out.innerHTML = `<div class="empty" style="margin-top:12px">계좌번호를 찾지 못했어요.${r.unknown.length ? '<br><small>' + h(r.unknown.slice(0, 3).join(' / ')) + '</small>' : ''}</div>`; return; }
    r.items.forEach(it => { it.checked = !it.conflict && !it.same; });
    out.innerHTML = previewRows(r.items, it => `<b>${h(it.m.name)}</b> <small class="muted">${h(teamName(teamNo(it.m), S.D.site))}${it.auto ? ' · 순서대로' : ''}</small><br>${it.m.vacct && !it.same ? `<s class="muted">${h(it.m.vacct)}</s> → ` : ''}<b class="mono">${h(it.acc)}</b>${it.same ? ' <small class="muted">(이미 같음)</small>' : ''}${it.conflict ? ` <small class="no">이미 ${h(it.conflict)} 님 계좌</small>` : ''}`)
      + (r.unknown.length ? `<p class="hint" style="margin-top:10px">넣지 못한 줄 ${r.unknown.length}개: ${h(r.unknown.slice(0, 4).join(' / '))}${r.unknown.length > 4 ? ' …' : ''}</p>` : '')
      + '<button class="btn primary block" id="vApply" style="margin-top:12px">저장</button>';
    const picked = bindApply(out, '#vApply', n => `${n}명 전용 계좌 저장`);
    out.querySelector('#vApply').onclick = async e => {
      const list = picked().map(i => ({ id: r.items[i].m.id, vacct: r.items[i].acc }));
      e.currentTarget.disabled = true; e.currentTarget.textContent = '저장 중…';
      try {
        S.D.members = await api('adm_saveVaccts', S.token, list); index();
        closeSheet(); renderAdm(true); toast(`${list.length}명 전용 계좌를 저장했어요`);
      } catch (err) { if (isAuth(err)) { handleErr(err); return; } toast(errMsg(err)); e.currentTarget.disabled = false; e.currentTarget.textContent = '다시 저장'; }
    };
  };
}

/* ── 입금 장부 ── */
const DEP_PILL = { '자동확인': 'ok', '임원확인': 'ok', '확인대기': 'wait', '미확인': 'no', '제외': 'mute' };

function depositsHtml() {
  const deps = S.D.deposits || [], pend = deps.filter(isPending);
  const act = activeMembers(), withV = act.filter(m => m.vacct).length;
  if (!S.f.dep) S.f.dep = pend.length ? 'todo' : 'all';
  const f = S.f.dep;
  const list = deps.filter(d => f === 'all' || (f === 'todo' && isPending(d)) || (f === 'done' && (d.state === '자동확인' || d.state === '임원확인')) || (f === 'off' && d.state === '제외'));
  const auto = deps.filter(d => d.state === '자동확인').length, vm = vacctMode();
  const done = deps.filter(d => d.state === '자동확인' || d.state === '임원확인').length, off = deps.filter(d => d.state === '제외').length;
  return `<div class="sumbar">
      <div class="sum ${pend.length ? 'no' : ''}"><b>${pend.length}</b><span>확인 필요</span></div>
      ${vm ? `<div class="sum ok"><b>${auto}</b><span>자동 확인</span></div>
      <div class="sum gold"><b>${withV}<small style="font:500 14px var(--sans);color:var(--muted)">/${act.length}</small></b><span>전용 계좌</span></div>`
      : `<div class="sum ok"><b>${done}</b><span>반영</span></div>
      <div class="sum"><b>${off}</b><span>제외</span></div>`}</div>
    ${vm && withV < act.length ? `<div class="card" style="margin-top:0;margin-bottom:12px"><div class="ct">회원 전용 계좌(가상계좌)</div>
      <p class="hint">회원마다 다른 입금 계좌를 주면, 가족 이름으로 보내도 누가 낸 회비인지 계좌번호로 바로 압니다. ${withV ? `아직 ${act.length - withV}명이 계좌가 없습니다.` : '은행에서 가상계좌를 받으면 여기에 넣으세요.'}</p>
      <button class="btn sm" data-a="pasteVaccts">전용 계좌 등록</button></div>` : ''}
    ${chips('dep', [['todo', `확인 필요 ${pend.length}`], ['done', '반영됨'], ['off', '제외'], ['all', '전체']])}
    <div id="list">${list.length ? list.map(depRow).join('') : `<div class="empty">${f === 'todo' ? '확인이 필요한 입금이 없습니다.' : '입금 기록이 없습니다.<br>행사 › 회비 탭에서 입금 내역을 붙여 넣거나, 아래 자동 받기를 켜세요.'}</div>`}</div>
    ${inboxCardHtml(deps)}`;
}

function depRow(d) {
  const who = d.name || d.payer || '누구인지 모름';
  const sub = [d.date ? dShort(d.date) + (d.time ? ' ' + d.time : '') : '', d.eventId ? evTitle(d.eventId) : '', d.via].filter(Boolean).join(' · ');
  const todo = isPending(d);
  return `<div class="mrow tap" data-dep="${h(d.id)}"><div class="mn"><b class="pay">${won(d.amount)}</b> <b>${h(who)}</b>${d.name && d.payer && d.payer !== d.name ? ` <small class="muted">입금자 ${h(d.payer)}</small>` : ''}
      <div class="sub"><span class="pill ${DEP_PILL[d.state] || 'mute'}">${h(d.state)}</span> ${h(sub)}</div>${todo && d.note ? `<div class="sub wait">${h(d.note)}</div>` : ''}</div>
    <span class="btn sm ${todo ? 'gold' : 'ghost'}">${todo ? '처리' : '보기'}</span></div>`;
}

function inboxCardHtml(deps) {
  const key = S.D.inboxKey, url = key ? (S.D.api || B.api || S.D.base || B.base) + '?key=' + key : '';
  const last = deps.filter(d => d.via === '자동수신')[0];
  if (!key) return `<div class="card"><div class="ct">은행 입금 문자 자동 받기</div>
    <p class="hint">${vacctMode() ? '총무 폰에 오는 은행 입금 알림을 이 홈페이지로 자동 전달하면, 전용 계좌로 들어온 회비는 바로 ‘입금 확인’이 됩니다.' : '총무 폰에 오는 은행 입금 알림을 이 홈페이지로 자동 전달하면 입금이 바로 장부에 올라가고, 이름이 맞는 회원은 ‘확인 필요’ 목록에서 한 번 눌러 확인합니다.'} 켜지 않아도 붙여넣기로 똑같이 쓸 수 있습니다.</p>
    <button class="btn block" data-a="newKey">자동 받기 주소 만들기</button></div>`;
  return `<div class="card"><div class="ct">은행 입금 문자 자동 받기</div>
    <div class="lb-l">받는 주소 — 다른 사람에게 알리지 마세요</div><div class="lb-u mono">${h(url)}</div>
    <div class="row2"><button class="btn sm primary" data-copy="${h(url)}">주소 복사</button><button class="btn sm ghost" data-a="newKey">주소 바꾸기</button></div>
    <p class="hint" style="margin-top:10px">마지막 자동 수신: ${last ? h(shortTs(last.at)) + ' · ' + won(last.amount) + ' · ' + h(last.state) : '아직 없음'}</p>
    <details class="how"><summary>총무 폰에 연결하는 방법</summary><ol>
      <li>입금 알림을 받는 총무 폰에 ‘문자(알림)를 웹 주소로 전달’하는 앱을 씁니다. 안드로이드는 MacroDroid 같은 자동화 앱, 아이폰은 ‘단축어 › 자동화 › 메시지’.</li>
      <li>조건: 보낸 사람이 은행 번호이고 내용에 ‘입금’이 있을 때.</li>
      <li>동작: 위 주소로 <b>POST</b> 요청, 본문에 받은 문자 내용을 그대로 넣습니다.</li>
      <li>시험으로 1,000원을 넣어 보고, 이 목록에 올라오는지 확인합니다.</li></ol></details></div>`;
}

function openDeposit(d) {
  if (!d) return;
  const site = S.D.site;
  const evs = S.D.events.filter(e => e.fee && e.status !== '숨김').sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const open = evs.filter(e => e.status === '진행' || e.status === '마감');
  const preEv = d.eventId || (open.length === 1 ? open[0].id : '');
  const memOpts = activeMembers().map(m => `<option value="${h(m.id)}" ${d.memberId === m.id ? 'selected' : ''}>${h(m.name)} (${h(teamName(teamNo(m), site))})</option>`).join('');
  const evOpts = evs.map(e => `<option value="${h(e.id)}" ${preEv === e.id ? 'selected' : ''}>${h(e.title)} · ${h(dShort(e.date))} · ${won(e.fee)}</option>`).join('');
  const todo = isPending(d), applied = d.state === '자동확인' || d.state === '임원확인', off = d.state === '제외';
  const sh = openSheet(`입금 ${won(d.amount)}`, `
    <dl class="kv">
      <dt>처리</dt><dd><span class="pill ${DEP_PILL[d.state] || 'mute'}">${h(d.state)}</span>${d.note ? ' ' + h(d.note) : ''}</dd>
      <dt>입금일</dt><dd>${h(dShort(d.date))}${d.time ? ' ' + h(d.time) : ''}</dd>
      <dt>입금자</dt><dd>${h(d.payer || '-')}</dd>
      <dt>계좌</dt><dd class="mono">${h(d.account || '-')}</dd>
      ${d.name ? `<dt>회원</dt><dd>${h(d.name)}${d.eventId ? '\n' + h(evTitle(d.eventId)) : ''}</dd>` : ''}
      <dt>받은 곳</dt><dd>${h(d.via || '-')} · ${h(shortTs(d.at))}</dd></dl>
    ${d.raw ? `<div class="lb-u" style="margin-top:10px">${h(d.raw)}</div>` : ''}
    ${off ? '' : `<label class="field"><span>누구의 입금인가요</span><select id="dMem"><option value="">— 회원 고르기 —</option>${memOpts}</select></label>
      <label class="field"><span>어느 행사 회비인가요</span><select id="dEv"><option value="">— 행사 고르기 —</option>${evOpts}</select></label>
      <div id="dWarn"></div>`}
    <div class="err" id="dErr"></div>`,
    { foot: off ? '<button class="btn" style="flex:1" data-dact="undo">확인 목록으로 되돌리기</button>'
      : todo ? '<button class="btn primary" style="flex:1" data-dact="assign">이 회원 입금으로 확인</button><button class="btn danger" data-dact="ignore">회비 아님</button>'
      : applied ? '<button class="btn primary" style="flex:1" data-dact="assign">고른 대로 바꾸기</button><button class="btn danger" data-dact="undo">되돌리기</button>' : '' });
  const warn = () => {
    const el = sh.querySelector('#dWarn');
    if (!el) return;
    const mid = val(sh, '#dMem'), eid = val(sh, '#dEv');
    const p = mid && eid ? part(eid, mid) || {} : {};
    const same = applied && mid === d.memberId && eid === d.eventId;
    el.innerHTML = p.pay === '확인' && !same
      ? `<div class="warn">이 회원은 이 행사 회비가 이미 입금 확인(${won(p.amount)})되어 있습니다. 확인하면 금액이 더해집니다(${won((Number(p.amount) || 0) + (Number(d.amount) || 0))}).</div>` : '';
  };
  sh.addEventListener('change', warn); warn();
  sh.querySelectorAll('[data-dact]').forEach(b => { b.onclick = () => depAct(d, b.getAttribute('data-dact'), sh); });
}

async function depAct(d, action, sh, mid, eid) {
  if (sh) {
    mid = val(sh, '#dMem'); eid = val(sh, '#dEv');
    const err = sh.querySelector('#dErr');
    if (action === 'assign' && (!mid || !eid)) { if (err) err.textContent = '회원과 행사를 골라 주세요.'; return; }
    sh.querySelectorAll('[data-dact]').forEach(b => { b.disabled = true; });
  }
  setSync('saving');
  try {
    await settle();
    const r = await api('adm_depositAction', S.token, d.id, action, mid || '', eid || '');
    S.D.parts = r.parts; S.D.deposits = r.deposits; index();
    if (sh) closeSheet();
    renderAdm(true); setSync('ok');
    toast(action === 'assign' ? '입금 확인으로 반영했어요' : action === 'ignore' ? '회비가 아닌 입금으로 뺐어요' : '되돌렸어요');
  } catch (e) {
    if (isAuth(e)) { handleErr(e); return; }
    setSync('err');
    if (sh) { const err = sh.querySelector('#dErr'); if (err) err.textContent = errMsg(e); sh.querySelectorAll('[data-dact]').forEach(b => { b.disabled = false; }); }
    else toast(errMsg(e));
  }
}

async function newInboxKey() {
  if (S.D.inboxKey && !window.confirm('주소를 바꾸면 지금 주소로는 더 이상 받지 않습니다.\n폰 앱에도 새 주소를 넣어야 합니다. 바꿀까요?')) return;
  setSync('saving');
  try { S.D.inboxKey = await api('adm_newInboxKey', S.token); renderAdm(true); setSync('ok'); toast('자동 받기 주소를 만들었어요'); }
  catch (e) { handleErr(e); }
}

/* ── 자료 ── */
function filesHtml() {
  const files = S.D.files.slice().sort((a, b) => String(b.created || '').localeCompare(String(a.created || '')));
  return `<div class="tools"><button class="btn sm primary" data-a="addFile">+ 자료 추가</button>${S.D.sheetUrl ? `<a class="btn sm" href="${h(S.D.sheetUrl)}" target="_blank" rel="noopener">관리 시트 열기</a>` : ''}</div>
    <p class="hint">명찰·현수막·초대장 같은 제작물은 구글 드라이브 링크로 모아 두면 임원 모두 같은 파일을 봅니다.</p>
    ${files.length ? files.map(f => `<div class="mrow tap" data-file="${h(f.id)}"><div class="mn"><b>${h(f.title)}</b>${f.version ? ` <span class="tag">${h(f.version)}</span>` : ''}
      <div class="sub">${h([f.kind, evTitle(f.eventId), f.memo].filter(Boolean).join(' · ') || '설명 없음')}</div></div>
      ${f.url ? `<a class="btn sm" href="${h(f.url)}" target="_blank" rel="noopener">열기</a>` : ''}</div>`).join('') : '<div class="empty">등록된 자료가 없습니다.</div>'}`;
}
function openFile(f) {
  const isNew = !f;
  const v = f || { title: '', kind: '초대장', version: 'v1', url: '', eventId: S.evId || '', memo: '' };
  const kinds = ['초대장', '명찰', '현수막', '명단', '시상·상장', '사진', '영수증', '기타'];
  const sh = openSheet(isNew ? '자료 추가' : '자료', `
    <label class="field"><span>이름 *</span><input id="fTitle" value="${h(v.title)}" maxlength="80" placeholder="예: 송년회 명찰 인쇄 파일"></label>
    <div class="row2"><label class="field" style="flex:1"><span>종류</span><select id="fKind">${kinds.map(k => `<option ${v.kind === k ? 'selected' : ''}>${k}</option>`).join('')}</select></label>
      <label class="field" style="flex:1"><span>버전</span><input id="fVer" value="${h(v.version)}" maxlength="20" placeholder="v1"></label></div>
    <label class="field"><span>링크 (구글 드라이브 등)</span><input id="fUrl" type="url" value="${h(v.url)}" placeholder="https://"></label>
    <label class="field"><span>행사</span><select id="fEv"><option value="">— 없음 —</option>${S.D.events.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).map(e => `<option value="${h(e.id)}" ${v.eventId === e.id ? 'selected' : ''}>${h(e.title)}</option>`).join('')}</select></label>
    <label class="field"><span>메모</span><input id="fMemo" value="${h(v.memo)}" maxlength="200"></label>
    <div class="err" id="fErr"></div>`, { foot: `<button class="btn primary" style="flex:1" id="fSave">저장</button>${isNew ? '' : '<button class="btn danger" id="fDel">삭제</button>'}` });
  sh.querySelector('#fSave').onclick = async e => {
    const o = { id: isNew ? '' : v.id, title: val(sh, '#fTitle'), kind: val(sh, '#fKind'), version: val(sh, '#fVer'), url: val(sh, '#fUrl').trim(), eventId: val(sh, '#fEv'), memo: val(sh, '#fMemo') };
    if (!o.title.trim()) { sh.querySelector('#fErr').textContent = '이름을 넣어 주세요.'; return; }
    e.currentTarget.disabled = true;
    try { S.D.files = await api('adm_saveFile', S.token, o); closeSheet(); renderAdm(true); toast('저장했어요'); }
    catch (err) { if (isAuth(err)) { handleErr(err); return; } sh.querySelector('#fErr').textContent = errMsg(err); e.currentTarget.disabled = false; }
  };
  const del = sh.querySelector('#fDel');
  if (del) del.onclick = async () => {
    if (!window.confirm('이 자료 항목을 삭제할까요? (드라이브 파일은 그대로 남습니다)')) return;
    try { S.D.files = await api('adm_deleteFile', S.token, v.id); closeSheet(); renderAdm(true); } catch (err) { handleErr(err); }
  };
}

/* ── 가입(회원 카드) 확인 ── */
const C = { list: null, ph: {}, loading: false };
const pendingCards = () => (C.list || []).filter(c => c.state === '대기');
const joinBase = () => S.D.base || B.base;

/** 회원별 카드 상태 — 승인이 대기보다 앞섭니다 */
function cardStates() {
  const st = {};
  (C.list || []).forEach(c => {
    if (!c.memberId) return;
    if (c.state === '승인') st[c.memberId] = '승인';
    else if (c.state === '대기' && st[c.memberId] !== '승인') st[c.memberId] = '대기';
  });
  return st;
}

async function loadCards(rerender) {
  if (C.loading) return;
  C.loading = true;
  try {
    C.list = await api('adm_cards', S.token);
    if (rerender || S.view === 'join') renderAdm(true);
    else { const nav = document.querySelector('.bnav'); if (nav) nav.outerHTML = navHtml(); }
  } catch (e) { handleErr(e); }
  finally { C.loading = false; }
}

async function loadCardPhotos(list) {
  const need = list.map(c => c.photo).filter(p => p && !C.ph[p]);
  for (let i = 0; i < need.length; i += 20) {
    try { Object.assign(C.ph, await api('adm_photos', S.token, need.slice(i, i + 20))); paintPhotos(C.ph, 'data-cph'); }
    catch (e) { handleErr(e); break; }
  }
}

function joinAdmHtml() {
  if (!C.list) { setTimeout(() => loadCards(true), 0); return loadingHtml('가입 신청을 불러오는 중…'); }
  const site = S.D.site, act = activeMembers(), st = cardStates();
  const pend = pendingCards();
  const done = act.filter(m => st[m.id] === '승인');
  const not = act.filter(m => !st[m.id]);
  const base = joinBase();
  const f = S.f.join;
  let body;
  if (f === 'not') {
    const groups = [1, 2, 3, 0].map(no => ({ no: no, list: not.filter(m => teamNo(m) === no) })).filter(g => g.list.length);
    body = not.length ? `<div class="tools"><button class="btn sm" data-a="copyNotJoined">이름 복사</button></div>
      ${groups.map(g => `<div class="tgroup"><div class="tgh" style="--tc:${TEAM_COLOR[g.no]}"><i></i>${h(teamName(g.no, site))}<small>${g.list.length}명</small></div><div class="nlist">${g.list.map(m => `<span>${h(m.name)}</span>`).join('')}</div></div>`).join('')}`
      : '<div class="empty">활동 회원 모두 회원 카드를 냈습니다.</div>';
  } else {
    const list = C.list.filter(c => f === '승인' ? c.state === '승인' : f === '반려' ? (c.state === '반려' || c.state === '교체') : c.state === '대기');
    body = list.length ? list.map(cardRow).join('') : `<div class="empty">${f === '대기' ? '확인을 기다리는 신청이 없습니다.<br>위 ‘단톡방 안내 문구’를 보내 가입을 알려 주세요.' : '해당하는 카드가 없습니다.'}</div>`;
    setTimeout(() => loadCardPhotos(list), 0);
  }
  return `<div class="sumbar">
      <div class="sum wait"><b>${pend.length}</b><span>확인 기다림</span></div>
      <div class="sum ok"><b>${done.length}</b><span>등록 완료</span></div>
      <div class="sum"><b>${not.length}</b><span>아직 안 냄</span></div>
    </div>
    <div class="card" style="margin-top:0"><div class="ct">회원 가입 링크</div>
      <div class="lb-u">${h(base)}?join</div>
      <div class="row2"><button class="btn sm primary" data-a="copyJoinMsg">단톡방 안내 문구 복사</button><button class="btn sm" data-copy="${h(base + '?join')}">링크만 복사</button></div>
      <div class="lb-l" style="margin-top:12px">회원 소개 (승인 + 공개 동의한 카드만)</div>
      <div class="lb-u">${h(base)}?members</div><button class="btn sm" data-copy="${h(base + '?members')}">복사</button></div>
    ${chips('join', [['대기', `확인 기다림 ${pend.length}`], ['승인', `등록 완료 ${done.length}`], ['반려', '반려'], ['not', `안 낸 회원 ${not.length}`]])}
    <div id="list">${body}</div>`;
}

function cardRow(c) {
  const m = c.memberId ? IDX.mem[c.memberId] : null;
  const sug = !m && c.state === '대기' ? suggestMembers(c)[0] : null;
  const tag = m ? '<span class="pill ok">명부 있음</span>' : sug ? '<span class="pill wait">비슷한 이름</span>' : '<span class="pill mute">새 회원</span>';
  return `<div class="mrow tap" data-card="${h(c.id)}"><div class="cph" data-cph="${h(c.photo || '')}">${C.ph[c.photo] ? `<img src="${C.ph[c.photo]}" alt="">` : initial(c.name)}</div>
    <div class="mn"><b>${h(c.name)}</b> ${tag}${c.state === '교체' ? ' <span class="tag">예전 카드</span>' : ''}
      <div class="sub">${h([teamName(c.team, S.D.site), c.phone, [c.company, c.position].filter(Boolean).join(' ')].filter(Boolean).join(' · '))}</div>
      <div class="sub">${h(shortTs(c.at))} 신청${c.pubCard === 'Y' ? '' : ' · 소개 비공개'}${c.note ? ' · ' + h(c.note) : ''}</div></div><span class="go">›</span></div>`;
}

/** 이름이 비슷한 명부 회원(한 글자 다름·포함) 또는 번호가 같은 회원 */
function lev(a, b) {
  const m = a.length, n = b.length;
  if (Math.abs(m - n) > 2) return 9;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function suggestMembers(c) {
  const nm = String(c.name || '').replace(/\s/g, ''), ph = String(c.phone || '').replace(/\D/g, '');
  const taken = cardStates();
  return S.D.members.map(m => {
    const mn = String(m.name || '').replace(/\s/g, '');
    const mp = String(m.phone || '').replace(/\D/g, '');
    let s = 0;
    if (ph && mp && ph === mp) s = 100;
    else if (mn === nm) s = 90;
    else if (mn.length >= 2 && nm.length >= 2 && (mn.indexOf(nm) >= 0 || nm.indexOf(mn) >= 0)) s = 70;
    else if (lev(mn, nm) === 1) s = 60;
    if (s && String(m.team) === String(c.team)) s += 5;
    if (s && taken[m.id] === '승인') s -= 20;
    return { m: m, s: s };
  }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 5).map(x => x.m);
}

function openCard(c) {
  if (!c) return;
  const site = S.D.site, m = c.memberId ? IDX.mem[c.memberId] : null;
  const sug = suggestMembers(c).filter(x => !m || x.id !== m.id);
  const def = m ? m.id : (sug[0] && (String(sug[0].phone || '').replace(/\D/g, '') === String(c.phone || '').replace(/\D/g, '') || sug[0].name === c.name) ? sug[0].id : '');
  const opt = x => `<option value="${h(x.id)}" ${x.id === def ? 'selected' : ''}>${h(teamName(x.team, site))} ${h(x.name)}${x.phone ? ' · ' + h(x.phone) : ''}${x.status && x.status !== '활동' ? ' (' + h(x.status) + ')' : ''}</option>`;
  const byTeam = [1, 2, 3, 0].map(no => ({ no: no, list: sortMembers(S.D.members.filter(x => teamNo(x) === no)) })).filter(g => g.list.length);
  const linkSel = `<select id="cLink"><option value="" ${def ? '' : 'selected'}>새 회원으로 명부에 추가</option>
    ${m ? `<optgroup label="신청할 때 고른 이름">${opt(m)}</optgroup>` : ''}
    ${sug.length ? `<optgroup label="비슷한 이름">${sug.map(opt).join('')}</optgroup>` : ''}
    ${byTeam.map(g => `<optgroup label="${h(teamName(g.no, site))}">${g.list.map(opt).join('')}</optgroup>`).join('')}</select>`;
  const stPill = { '대기': '<span class="pill wait">확인 기다림</span>', '승인': '<span class="pill ok">승인됨</span>', '반려': '<span class="pill no">반려</span>', '교체': '<span class="pill mute">예전 카드</span>' }[c.state] || '';
  const foot = c.state === '승인'
    ? `<button class="btn primary" style="flex:1" id="cSave">고친 내용 저장</button><button class="btn" id="cBack">대기로</button><button class="btn danger" id="cDel">삭제</button>`
    : `<button class="btn primary" style="flex:1" id="cOk">승인</button><button class="btn" id="cNo">반려</button><button class="btn danger" id="cDel">삭제</button>`;
  const sh = openSheet('회원 카드 확인', `
    <div class="cdet"><div class="cbig" data-cph="${h(c.photo || '')}">${C.ph[c.photo] ? `<img src="${C.ph[c.photo]}" alt="">` : '<span>사진 없음</span>'}</div>
      <div class="cmeta">${stPill}<div class="sub">${h(shortTs(c.at))} 신청</div>${c.agreeAt ? `<div class="sub">개인정보 동의 ${h(shortTs(c.agreeAt))}</div>` : ''}${c.doneAt ? `<div class="sub">${h(shortTs(c.doneAt))} 처리</div>` : ''}
        ${c.photo ? '<label class="mini-chk"><input type="checkbox" id="cDropPhoto"> 사진 빼기</label>' : ''}</div></div>
    ${c.note ? `<div class="warn">신청자 메모 — ${h(c.note)}</div>` : ''}
    <label class="field"><span>이름 *</span><input id="cName" value="${h(c.name)}" maxlength="20"></label>
    <div class="row2"><label class="field" style="flex:1;min-width:120px"><span>조</span><select id="cTeam">${[1, 2, 3].map(n => `<option value="${n}" ${String(c.team) === String(n) ? 'selected' : ''}>${h(teamName(n, site))}</option>`).join('')}<option value="" ${['1', '2', '3'].indexOf(String(c.team)) >= 0 ? '' : 'selected'}>모름</option></select></label>
      <label class="field" style="flex:1.3;min-width:150px"><span>휴대폰</span><input id="cPhone" type="tel" value="${h(c.phone)}"></label></div>
    <label class="field"><span>업체(상호)</span><input id="cCompany" value="${h(c.company)}" maxlength="40"></label>
    <div class="row2"><label class="field" style="flex:1;min-width:120px"><span>직책</span><input id="cPosition" value="${h(c.position)}" maxlength="30"></label>
      <label class="field" style="flex:1.4;min-width:150px"><span>하는 일·업종</span><input id="cBiz" value="${h(c.biz)}" maxlength="40"></label></div>
    <label class="field"><span>한마디 소개</span><textarea id="cIntro" rows="2" maxlength="100">${h(c.intro)}</textarea></label>
    <label class="chk2"><input type="checkbox" id="cPubCard" ${c.pubCard === 'Y' ? 'checked' : ''}><span><b>회원 소개·카탈로그에 싣기</b><small>신청자가 고른 값입니다. 본인 뜻 없이 바꾸지 마세요.</small></span></label>
    <label class="chk2"><input type="checkbox" id="cPubPhone" ${c.pubPhone === 'Y' ? 'checked' : ''}><span><b>휴대폰 번호 보이기</b></span></label>
    <div class="ct" style="margin-top:14px">명부 연결</div>
    <p class="hint">승인하면 이 카드가 아래 회원과 묶입니다. 명부에 없는 분이면 ‘새 회원으로 명부에 추가’를 고르세요.</p>
    <label class="field" style="margin-top:0">${linkSel}</label>
    <div id="cLinkOpt"></div>
    <label class="field"><span>처리 메모 (선택)</span><input id="cMemo" value="${h(c.doneMemo || '')}" maxlength="200"></label>
    <div class="err" id="cErr"></div>`, { foot: foot });
  const linkOpt = () => {
    const id = val(sh, '#cLink'), x = id ? IDX.mem[id] : null, box = sh.querySelector('#cLinkOpt');
    if (!x) { box.innerHTML = `<p class="hint">새 회원 번호를 받아 ${h(teamName(val(sh, '#cTeam'), site))} 명단에 들어갑니다.</p>`; return; }
    const nm = val(sh, '#cName').replace(/\s/g, ''), ph = val(sh, '#cPhone').replace(/\D/g, ''), xp = String(x.phone || '').replace(/\D/g, '');
    let html = '';
    if (nm && nm !== x.name) html += `<label class="mini-chk"><input type="checkbox" id="cSetName"> 명부 이름 고치기: ${h(x.name)} → ${h(nm)}</label>`;
    if (ph && xp && ph !== xp) html += `<label class="mini-chk"><input type="checkbox" id="cSetPhone"> 명부 번호 바꾸기: ${h(x.phone)} → 카드 번호</label>`;
    else if (ph && !xp) html += '<p class="hint">명부에 번호가 없어 카드의 번호를 넣습니다. 그 뒤로는 행사 회신 때 번호 뒷 4자리로 본인 확인을 합니다.</p>';
    if (String(x.team) && ['1', '2', '3'].indexOf(String(x.team)) >= 0 && String(x.team) !== val(sh, '#cTeam')) html += `<p class="warn">명부에는 ${h(teamName(x.team, site))}입니다. 조를 옮기려면 승인 뒤 회원 탭에서 바꾸세요.</p>`;
    box.innerHTML = html;
  };
  linkOpt();
  ['#cLink', '#cName', '#cPhone', '#cTeam'].forEach(s => { const el = sh.querySelector(s); if (el) el.addEventListener(s === '#cLink' || s === '#cTeam' ? 'change' : 'input', linkOpt); });
  const collect = () => ({
    edit: {
      name: val(sh, '#cName'), team: val(sh, '#cTeam'), phone: val(sh, '#cPhone'), company: val(sh, '#cCompany'), position: val(sh, '#cPosition'), biz: val(sh, '#cBiz'), intro: val(sh, '#cIntro'),
      pubCard: sh.querySelector('#cPubCard').checked, pubPhone: sh.querySelector('#cPubPhone').checked, dropPhoto: !!(sh.querySelector('#cDropPhoto') || {}).checked
    },
    link: val(sh, '#cLink'),
    setName: !!(sh.querySelector('#cSetName') || {}).checked,
    setPhone: !!(sh.querySelector('#cSetPhone') || {}).checked,
    memo: val(sh, '#cMemo')
  });
  const run = async (btn, action, msg) => {
    const o = action === '삭제' || action === '대기' ? {} : collect();
    if (action === '반려' && !window.confirm(`${c.name} 님의 신청을 반려할까요?\n명부에는 들어가지 않고, 회원 소개에도 실리지 않습니다.`)) return;
    if (action === '삭제' && !window.confirm(`${c.name} 님의 회원 카드를 지울까요?\n되돌릴 수 없습니다. (명부의 회원 정보는 그대로 남습니다)`)) return;
    sh.querySelectorAll('.sheet-f .btn').forEach(b => { b.disabled = true; });
    const label = btn.textContent; btn.textContent = '처리 중…';
    try {
      const r = await api('adm_cardDecide', S.token, c.id, action, o);
      C.list = r.cards; S.D.members = r.members; index();
      closeSheet(); renderAdm(true); toast(msg);
    } catch (err) {
      if (isAuth(err)) { handleErr(err); return; }
      sh.querySelector('#cErr').textContent = errMsg(err);
      sh.querySelectorAll('.sheet-f .btn').forEach(b => { b.disabled = false; }); btn.textContent = label;
    }
  };
  const on = (id, fn) => { const b = sh.querySelector(id); if (b) b.onclick = e => fn(e.currentTarget); };
  on('#cOk', b => run(b, '승인', val(sh, '#cLink') ? '승인했어요 — 명부와 묶였습니다' : '승인했어요 — 새 회원으로 명부에 넣었습니다'));
  on('#cNo', b => run(b, '반려', '반려했어요'));
  on('#cSave', b => run(b, '수정', '저장했어요'));
  on('#cBack', b => run(b, '대기', '확인 기다림으로 되돌렸어요'));
  on('#cDel', b => run(b, '삭제', '지웠어요'));
  if (c.photo && !C.ph[c.photo]) loadCardPhotos([c]);
}

function joinMsg() {
  const s = S.D.site, base = joinBase();
  return lines([`[${s.name}] 회원 카드 등록 안내`, '', `${s.name} 회원 여러분, 홈페이지에 내 회원 카드를 만들어 주세요.`, '사진과 업체·하는 일을 올려 주시면 임원 확인 후', `회원 소개와 ${s.name} 카탈로그에 실립니다.`, '',
    '▶ 회원 카드 만들기 (1분이면 됩니다)', base + '?join', '', '▶ 회원 소개 보기', base + '?members', '',
    '명단에 이름이 없는 분도 ‘새로 가입’으로 내 주시면 됩니다.']);
}

function copyNotJoined() {
  const s = S.D.site, st = cardStates();
  const not = activeMembers().filter(m => !st[m.id]);
  if (!not.length) { toast('모두 냈습니다'); return; }
  const by = [1, 2, 3, 0].map(no => ({ no: no, list: not.filter(m => teamNo(m) === no) })).filter(g => g.list.length);
  copyText(lines([`[${s.name}] 회원 카드 아직 안 내신 분 ${not.length}명`, '', ...by.map(g => `${teamName(g.no, s)}: ${g.list.map(m => m.name).join(', ')}`), '', '▶ 회원 카드 만들기', joinBase() + '?join']));
}

function cardPill(m) {
  if (!C.list) return '';
  const st = cardStates()[m.id];
  return st === '승인' ? ' <span class="pill ok">카드</span>' : st === '대기' ? ' <span class="pill wait">카드 확인 중</span>' : '';
}

/* ── 설정 ── */
function settingsHtml() {
  const s = S.D.site, base = S.D.base || B.base;
  return `<div class="card" style="margin-top:0"><div class="ct">주소</div>
      <div class="lb-l">회원용 홈페이지</div><div class="lb-u">${h(base)}</div><button class="btn sm" data-copy="${h(base)}">복사</button>
      <div class="lb-l" style="margin-top:14px">회원 가입 (회원 카드 만들기)</div><div class="lb-u">${h(base)}?join</div><button class="btn sm" data-copy="${h(base + '?join')}">복사</button>
      <div class="lb-l" style="margin-top:14px">회원 소개</div><div class="lb-u">${h(base)}?members</div><button class="btn sm" data-copy="${h(base + '?members')}">복사</button>
      <div class="lb-l" style="margin-top:14px">임원 관리 (비밀번호 필요)</div><div class="lb-u">${h(base)}?admin</div><button class="btn sm" data-copy="${h(base + '?admin')}">복사</button>
      ${S.D.sheetUrl ? `<div style="margin-top:14px"><a class="btn sm" href="${h(S.D.sheetUrl)}" target="_blank" rel="noopener">관리 시트(구글 시트) 열기</a></div>` : ''}</div>
    <form class="card" id="setForm"><div class="ct">모임 정보</div>
      <label class="field"><span>모임 이름</span><input name="groupName" value="${h(s.name)}" maxlength="30"></label>
      <label class="field"><span>소개 문구 (홈페이지 첫 화면, 선택)</span><textarea name="intro" rows="3" maxlength="500">${h(s.intro)}</textarea></label>
      <label class="field"><span>문의처 — 예: 총무 홍길동 010-1234-5678</span><input name="contact" value="${h(s.contact)}" maxlength="100"></label>
      <label class="field"><span>기본 입금 계좌 — 예: 국민 123456-01-234567 홍길동</span><input name="account" value="${h(s.account)}" maxlength="80"></label>
      <div class="row2">${[1, 2, 3].map(n => `<label class="field" style="flex:1;min-width:90px"><span>${n}조 이름</span><input name="team${n}" value="${h(s.teams[n] || '')}" maxlength="10"></label>`).join('')}</div>
      ${DUES_TRACK ? `<div class="ct" style="margin-top:16px">회원 전용 입금 계좌 (가상계좌)</div>
      <div class="row2"><label class="field" style="flex:1;min-width:130px"><span>은행</span><input name="vbank" value="${h(s.vbank || '')}" maxlength="20" placeholder="예: 하나은행"></label>
        <label class="field" style="flex:1;min-width:130px"><span>예금주</span><input name="vholder" value="${h(s.vholder || '')}" maxlength="30" placeholder="예: 백인회"></label></div>
      <p class="hint">${vacctMode() ? '회원마다 받은 계좌번호는 ‘회원 › 전용 계좌 등록’에서 넣습니다.' : '나중에 은행에서 가상계좌를 받으면 은행·예금주를 넣고 저장하세요. 그때부터 ‘회원 › 전용 계좌 등록’이 나타납니다.'} 가상계좌의 모계좌는 위 ‘기본 입금 계좌’에 넣어 두면 회원 계좌와 헷갈리지 않습니다.</p>` : ''}
      <button class="btn primary block" type="submit">저장</button></form>
    <form class="card" id="pwForm"><div class="ct">관리자 비밀번호 바꾸기</div>
      <label class="field"><span>새 비밀번호 (4자 이상)</span><input name="newPassword" type="password" autocomplete="new-password"></label>
      <p class="hint">바꾸면 다른 임원도 새 비밀번호로 다시 로그인해야 합니다.</p>
      <button class="btn block" type="submit">비밀번호 바꾸기</button></form>
    <button class="btn ghost block" data-a="logout" style="margin-top:14px">로그아웃</button>`;
}

async function saveSettings(form, pwOnly) {
  const fd = {};
  Array.from(form.elements).forEach(el => { if (el.name) fd[el.name] = el.value; });
  if (pwOnly && String(fd.newPassword || '').trim().length < 4) { toast('비밀번호는 4자 이상으로 정해 주세요.'); return; }
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true;
  try {
    const r = await api('adm_saveSettings', S.token, fd);
    S.D.site = r.site;
    if (r.token) { S.token = r.token; lsSet('bih_tok', r.token); }
    renderAdm(true); toast(pwOnly ? '비밀번호를 바꿨어요' : '저장했어요');
  } catch (e) { handleErr(e); btn.disabled = false; }
}

/* ── 명단 복사 ── */
function copyNames(ev, kind) {
  const s = S.D.site;
  if (kind === 'none') {
    const L = namesBy(ev, (m, p) => !p.attend);
    if (!L.length) { toast('미회신자가 없습니다'); return; }
    copyText(lines([`[${s.name}] ${ev.title} 미회신 ${stats(ev).none}명`, '', ...L, '', inviteUrl(ev)]));
  } else {
    const L = namesBy(ev, (m, p) => p.attend === '참석' && p.pay !== '확인');
    if (!L.length) { toast('미입금 참석자가 없습니다'); return; }
    copyText(lines([`[${s.name}] ${ev.title} 회비 미확인 ${stats(ev).unconfirmed}명`, '', ...L]));
  }
}

/* ── 누름 처리 ── */
function admAction(a) {
  const ev = curEv();
  switch (a) {
    case 'back': S.view = 'events'; S.q = ''; renderAdm(); break;
    case 'reload': reloadData(); break;
    case 'newEvent': openEventForm(); break;
    case 'editEvent': openEventForm(ev); break;
    case 'dupEvent': openEventForm(ev, true); break;
    case 'delEvent': deleteEvent(); break;
    case 'makeImg': makeImage(ev); break;
    case 'pasteRsvp': openPasteRsvp(ev); break;
    case 'pastePay': openPastePay(ev); break;
    case 'copyNone': copyNames(ev, 'none'); break;
    case 'copyUnpaid': copyNames(ev, 'unpaid'); break;
    case 'addMember': openMember(); break;
    case 'pasteContacts': openPasteContacts(); break;
    case 'pasteVaccts': openPasteVaccts(); break;
    case 'newKey': newInboxKey(); break;
    case 'addFile': openFile(); break;
    case 'copyJoinMsg': copyText(joinMsg()); break;
    case 'copyNotJoined': copyNotJoined(); break;
    case 'logout': lsDel('bih_tok'); S.token = null; showLogin(); break;
    default: break;
  }
}

function onAdmClick(e) {
  const t = e.target;
  let el;
  if (t.closest('a[href]')) return;
  if (t.closest('#sheet-root')) return;
  if ((el = t.closest('[data-nav]'))) { S.view = el.getAttribute('data-nav'); S.q = ''; renderAdm(); return; }
  if ((el = t.closest('[data-open]'))) {
    S.evId = el.getAttribute('data-open'); S.view = 'event'; S.q = '';
    const ev = curEv(); const st = stats(ev);
    S.sub = st.yes + st.no ? 'rsvp' : 'msg';
    renderAdm(); return;
  }
  if ((el = t.closest('[data-sub]'))) {
    S.sub = el.getAttribute('data-sub'); S.q = '';
    document.querySelectorAll('.st').forEach(b => b.classList.toggle('on', b === el));
    refreshSub(); return;
  }
  if ((el = t.closest('[data-status]'))) { setStatus(el.getAttribute('data-status')); return; }
  if ((el = t.closest('[data-f]'))) {
    S.f[el.getAttribute('data-f')] = el.getAttribute('data-v');
    if (S.view === 'event') refreshSub(); else renderAdm(true);
    return;
  }
  const ev = S.view === 'event' ? curEv() : null;
  if (ev && (el = t.closest('[data-set]'))) {
    const mid = el.getAttribute('data-m'), v = el.getAttribute('data-v');
    const cur = (part(ev.id, mid) || {}).attend || '';
    queuePatch(ev.id, mid, { attend: cur === v ? '' : v });
    updateRow(ev, mid); updateSum(ev); return;
  }
  if (ev && (el = t.closest('[data-payok]'))) {
    const mid = el.getAttribute('data-payok');
    // 자동으로 받은 '확인대기' 입금이 있으면 그 입금을 확인(장부와 함께)
    const pend = (S.D.deposits || []).filter(d => d.state === '확인대기' && d.memberId === mid && d.eventId === ev.id)[0];
    if (pend && (part(ev.id, mid) || {}).pay !== '확인') { depAct(pend, 'assign', null, mid, ev.id); return; }
    queuePatch(ev.id, mid, { pay: '확인', amount: ev.fee, payDate: S.D.today });
    updateRow(ev, mid); updateSum(ev); return;
  }
  if (ev && (el = t.closest('[data-paymenu]'))) { openPayMenu(ev, IDX.mem[el.getAttribute('data-paymenu')]); return; }
  if (ev && (el = t.closest('[data-att]'))) {
    const mid = el.getAttribute('data-att');
    queuePatch(ev.id, mid, { att: !(part(ev.id, mid) || {}).att });
    updateRow(ev, mid); updateSum(ev); return;
  }
  if ((el = t.closest('[data-mem]'))) { openMember(IDX.mem[el.getAttribute('data-mem')]); return; }
  if ((el = t.closest('[data-card]'))) { openCard((C.list || []).filter(c => c.id === el.getAttribute('data-card'))[0]); return; }
  if ((el = t.closest('[data-dep]'))) { openDeposit((S.D.deposits || []).filter(d => d.id === el.getAttribute('data-dep'))[0]); return; }
  if ((el = t.closest('[data-file]'))) { openFile(S.D.files.filter(f => f.id === el.getAttribute('data-file'))[0]); return; }
  if ((el = t.closest('[data-a]'))) admAction(el.getAttribute('data-a'));
}

/* ═════════════ 시작 ═════════════ */
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) { copyText(c.getAttribute('data-copy')); return; }
  const ct = e.target.closest('[data-copyta]');
  if (ct) { const ta = document.getElementById(ct.getAttribute('data-copyta')); if (ta) copyText(ta.value); return; }
  if (B.route === 'admin') { if (S.D) onAdmClick(e); } else onPubClick(e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-jq]')) { J.q = t.value; const g = document.getElementById('jgrid'); if (g) g.innerHTML = joinGridHtml(); return; }
  if (t.matches('[data-dq]')) { DIR.q = t.value; const g = document.getElementById('dgrid'); if (g) g.innerHTML = dirGridHtml(); return; }
  if (t.matches('[data-pq]')) { P.q = t.value; const g = document.getElementById('ngrid'); if (g) g.innerHTML = gridHtml(); return; }
  if (t.matches('[data-aq]')) { S.q = t.value; const ev = curEv(); const l = document.getElementById('list'); if (ev && l) l.innerHTML = groupedList(ev, S.sub); return; }
  if (t.matches('[data-mq]')) {
    S.memQ = t.value;
    const tmp = document.createElement('div'); tmp.innerHTML = membersHtml();
    const nl = tmp.querySelector('#list'), l = document.getElementById('list');
    if (nl && l) l.innerHTML = nl.innerHTML;
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  if (f.id === 'lf') { e.preventDefault(); doLogin(f); }
  else if (f.id === 'jf') { e.preventDefault(); sendCard(f); }
  else if (f.id === 'setForm') { e.preventDefault(); saveSettings(f, false); }
  else if (f.id === 'pwForm') { e.preventDefault(); saveSettings(f, true); }
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'jfile') pickPhoto(e.target.files && e.target.files[0]);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'l4') { e.preventDefault(); verify(); }
});

window.__booted = true;
async function start() {
  if (!window.BOOT) {
    try { Object.assign(B, await api('pub_boot', qsParams())); }
    catch (e) { B.error = errMsg(e); }
    if (!B.base) B.base = location.origin + location.pathname;
    if (B.title) document.title = B.title;
  }
  if (B.route === 'admin') {
    admStart();
  } else {
    document.body.classList.add('pubmode');
    if (B.error) app.innerHTML = errorHtml(B.error);
    else if (B.route === 'event') renderEvent(B.data);
    else if (B.route === 'join') renderJoin(B.data);
    else if (B.route === 'dir') renderDir(B.data);
    else renderHome(B.data);
    if (IN_GAS) {
      try { google.script.history.setChangeHandler(ev => routeTo((ev && ev.location && ev.location.parameter) || {})); } catch (e) { /* 없음 */ }
    } else {
      window.addEventListener('popstate', () => routeTo(qsParams()));
    }
  }
  // 예전 구글 주소로 들어오면 새 주소를 알려 줌
  if (IN_GAS && B.base && B.base.indexOf('script.google.com') < 0) {
    const bar = document.createElement('a');
    bar.href = B.base + (location.search || ''); bar.target = '_top'; bar.className = 'movebar';
    bar.textContent = '백인회 홈페이지 주소가 바뀌었습니다 — 새 주소로 열기 ›';
    document.body.insertBefore(bar, document.body.firstChild);
  }
}
start();
})();
