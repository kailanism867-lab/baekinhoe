<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>백인회</title>
<meta name="description" content="100인회 영원한 동지들 — 백인회 행사 안내·참석 회신·회원 소개">
<meta property="og:type" content="website">
<meta property="og:site_name" content="백인회">
<meta property="og:title" content="백인회 百人會">
<meta property="og:description" content="행사 안내 · 참석 회신 · 회원 카드 만들기">
<meta property="og:url" content="https://kailanism867-lab.github.io/baekinhoe/">
<meta property="og:image" content="https://kailanism867-lab.github.io/baekinhoe/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="theme-color" content="#1A2036">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1A2036;--ink2:#3C4259;--muted:#6E7283;--line:#E5DFD2;--line2:#EFEAE0;
  --paper:#F8F5EF;--card:#FFFFFF;--navy:#1A2036;
  --gold:#A47622;--gold2:#D8B467;--goldbg:#F6EEDC;
  --red:#C9323D;--blue:#2458A8;--yellow:#E0A40C;
  --ok:#17784A;--okbg:#E3F2EA;--no:#B4332A;--nobg:#FBE9E7;--wait:#8A6812;--waitbg:#FBF1D6;
  --r:14px;--sh:0 1px 2px rgba(26,32,54,.05),0 4px 14px rgba(26,32,54,.06);
  --sans:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Noto Serif KR","Noto Serif CJK KR","AppleMyungjo","Batang",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--sans);word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.muted{color:var(--muted)}
.ok{color:var(--ok)}.no{color:var(--no)}.wait{color:var(--wait)}.pay{color:var(--gold)}

/* buttons & fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px;text-decoration:none;color:var(--ink);line-height:1.2}
.btn.sm{min-height:38px;padding:7px 12px;font-size:14px}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--no);border-color:#EFC9C4;background:#fff}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;min-height:48px}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.err{color:var(--no);font-size:15px;margin:6px 0;min-height:0}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px;font-size:16px}
.empty{padding:26px 14px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--line2);color:var(--muted);font-weight:700;vertical-align:2px}
.dday{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--goldbg);color:var(--gold);font-weight:700;font-size:13px;white-space:nowrap}
.loading{padding:60px 20px;text-align:center;color:var(--muted)}
.loading.sm{padding:18px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ───── 회원용 ───── */
.pub{max-width:560px;margin:0 auto;padding:16px 16px 40px}
.brand{text-align:center;padding:26px 0 14px}
.hanja{font:900 54px/1.05 var(--serif);letter-spacing:.06em;background:linear-gradient(180deg,#EACD8A 0%,#B98A30 58%,#8C6216 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kname{margin-top:10px;font:700 15px/1 var(--sans);letter-spacing:.55em;padding-left:.55em;color:var(--gold)}
.logo{display:block;width:min(240px,66vw);height:auto;margin:0 auto}
.intro{text-align:center;color:var(--ink2);margin:6px 0 0;white-space:pre-line}
.sec{font:700 15px/1.2 var(--sans);color:var(--muted);margin:26px 2px 10px}
.evcard{display:flex;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.evdate{flex:0 0 64px;height:76px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.evdate b{font:900 30px/1 var(--serif);color:var(--gold2)}
.evdate span{font-size:13px;margin-top:5px}
.evdate em{font-style:normal;font-size:12px;opacity:.7;margin-top:3px}
.evbody{flex:1;min-width:0}
.evtitle{font:700 19px/1.35 var(--serif)}
.evmeta{color:var(--ink2);font-size:15px;margin-top:4px}
.evfoot{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:14px;flex-wrap:wrap}
.evfoot .cnt{color:var(--ok);font-weight:700}
.evfoot .go{margin-left:auto;color:var(--gold);font-weight:700}
.prow{display:flex;justify-content:space-between;gap:10px;width:100%;padding:13px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-size:16px}
.prow small{color:var(--muted);white-space:nowrap}
.foot{text-align:center;color:var(--muted);font-size:14px;margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.foot a[href^="tel"]{color:var(--ink2);font-weight:700}
.foot .admlink{display:inline-block;margin-top:12px;color:var(--muted);font-size:13px}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{border:0;background:none;color:var(--ink2);font-size:15px;padding:8px 0}
.mini{font:700 14px var(--serif);color:var(--gold)}
.invhero{position:relative;background:var(--navy);color:#fff;border-radius:20px;padding:32px 22px 26px;text-align:center;overflow:hidden;box-shadow:var(--sh)}
.invhero::before{content:"";position:absolute;inset:9px;border:1px solid rgba(216,180,103,.45);border-radius:14px;pointer-events:none}
.seal{font:900 24px/1 var(--serif);letter-spacing:.22em;padding-left:.22em;color:var(--gold2)}
.seal-logo{position:relative;display:block;width:min(180px,60%);height:auto;margin:0 auto}
.invhero .dd{display:inline-block;margin-top:14px;padding:4px 12px;border-radius:999px;background:rgba(216,180,103,.16);color:var(--gold2);font-weight:700;font-size:14px}
.invhero h1{font:700 29px/1.3 var(--serif);margin:12px 0 14px}
.when{font-size:18px;font-weight:500;line-height:1.5}
.where{margin-top:10px;font-size:17px;color:#ECE7DB}
.where small{display:block;font-size:14px;color:#BFB8A6;margin-top:2px}
.invhero .btn{position:relative;margin-top:16px;color:#fff;border-color:rgba(255,255,255,.35);background:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font:700 18px/1.3 var(--serif)}
.pre{white-space:pre-line;margin:0}
.feeamt{font:700 27px/1.2 var(--serif)}
.acc{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--paper);border-radius:10px;font-size:15px}
.acc span{flex:1}
.dl{margin:-4px 0 8px;color:var(--gold);font-weight:700}
.count{font-size:15px;color:var(--ink2);margin-bottom:12px}
.count b{color:var(--ok)}
.step{font-weight:700;margin:4px 0 10px}
.ttabs{display:flex;gap:6px;margin-bottom:10px}
.tt{flex:1;padding:11px 4px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.tt i{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:0 0 auto}
.tt.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ngrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nm{min-height:58px;padding:8px 4px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2}
.nm small{font-size:12px;font-weight:700;color:var(--gold);margin-top:3px}
.nm:active{background:var(--goldbg)}
.me{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:var(--goldbg);margin-bottom:12px}
.me b{font-size:20px}
.me small{color:var(--muted);margin-left:4px}
.me button{border:0;background:none;color:var(--gold);font-weight:700;font-size:14px;white-space:nowrap;padding:6px 0}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.bigbtn{min-height:66px;border-radius:14px;font:700 19px var(--sans);border:2px solid transparent}
.bigbtn.yes{background:var(--navy);color:#fff}
.bigbtn.no{background:#fff;color:var(--ink);border-color:var(--line)}
.bigbtn.sel{outline:3px solid var(--gold2);outline-offset:2px}
.status{padding:14px 16px;border-radius:12px;margin-bottom:10px;font-weight:700;font-size:18px}
.status.yes{background:var(--okbg);color:var(--ok)}
.status.no{background:var(--nobg);color:var(--no)}
.status small{display:block;font-weight:400;color:var(--ink2);margin-top:3px;font-size:14px}
.payline{padding:14px 16px;border-radius:12px;background:var(--paper);margin-top:4px;font-size:16px}
.ph{font-size:15px;color:var(--ink2)}
.vacc{margin-top:10px;padding:13px 14px;border:1.5px solid var(--gold2);border-radius:12px;background:#fff}
.vacc .vl{font-size:13px;color:var(--gold);font-weight:700}
.vacc .vb{font-size:15px;color:var(--ink2);margin-top:4px}
.vacc .vn{font:700 clamp(19px,5.6vw,23px)/1.3 var(--sans);letter-spacing:.01em;margin:1px 0 2px;white-space:nowrap;overflow-wrap:normal;word-break:keep-all}
.vacc .vh{font-size:14px;color:var(--ink2)}
.vnote{font-size:14px;color:var(--ink2);margin:8px 0 0}
.closed{padding:18px;text-align:center;background:var(--paper);border-radius:12px;color:var(--ink2)}

/* ───── 임원용 ───── */
.adm{min-height:100vh;padding-bottom:84px}
.abar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;height:54px;padding:0 6px 0 14px;background:var(--navy);color:#fff}
.abar-l{display:flex;align-items:center;gap:4px;min-width:0}
.abar-l b{font:700 17px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abar-r{display:flex;align-items:center}
.iconbtn{border:0;background:none;color:#fff;font-size:24px;width:42px;height:42px;border-radius:10px;line-height:1}
.sync{font-size:12px;color:var(--gold2);margin-right:2px;white-space:nowrap}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav button{position:relative;border:0;background:none;padding:8px 0 10px;font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.bnav .dot{position:absolute;top:3px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--no);color:#fff;font-size:11px;line-height:18px;text-align:center}
.bnav svg{width:23px;height:23px}
.bnav button.on{color:var(--navy)}
.bnav button.on svg{color:var(--gold)}
.pad{max-width:640px;margin:0 auto;padding:14px 14px 24px}
.aev{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:var(--sh)}
.aev-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.aev-t b{font:700 18px/1.3 var(--serif)}
.aev-m{color:var(--ink2);font-size:14px;margin-top:4px}
.aev-s{display:flex;gap:12px;font-size:14px;font-weight:700;margin-top:8px;flex-wrap:wrap}
.bar{display:flex;height:6px;border-radius:999px;background:var(--line2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%}
.b-ok{background:var(--ok)}.b-no{background:#E2A097}
.evhead{background:#fff;border-bottom:1px solid var(--line);padding:14px 14px 0}
.evhead > *{max-width:612px;margin-left:auto;margin-right:auto}
.evh-t{font:700 20px/1.3 var(--serif)}
.evh-m{color:var(--ink2);font-size:14px;margin-top:4px}
.subtabs{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;border:0;background:none;padding:11px 9px;font-weight:700;font-size:15px;color:var(--muted);border-bottom:3px solid transparent}
.st.on{color:var(--navy);border-bottom-color:var(--gold)}
.sumbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sum{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.sum b{display:block;font:700 25px/1.1 var(--serif)}
.sum span{font-size:13px;color:var(--muted)}
.sum.ok b{color:var(--ok)}.sum.no b{color:var(--no)}.sum.wait b{color:var(--wait)}.sum.gold b{color:var(--gold)}
.sum.wide{grid-column:1/-1;text-align:left;font-size:14px;color:var(--ink2);padding:10px 12px}
.sum.wide b{display:inline;font:700 15px var(--sans);color:var(--ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--ink2)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tgroup{margin-top:12px}
.tgh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:6px 2px;color:var(--ink2)}
.tgh i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.tgh small{margin-left:auto;color:var(--muted);font-weight:500}
.mrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 9px 9px 12px;margin-bottom:6px;min-height:58px}
.mrow.tap{cursor:pointer}
.mn{flex:1;min-width:0}
.mn b{font-size:17px}
.mn .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.role{display:inline-block;margin-left:6px;font-size:12px;padding:1px 7px;border-radius:999px;font-weight:700;vertical-align:2px}
.role.r0{background:var(--navy);color:var(--gold2)}
.role.r1{border:1px solid var(--gold2);color:var(--gold)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:#fff;padding:10px 11px;font-weight:700;font-size:14px;color:var(--muted);min-width:50px}
.seg button + button{border-left:1px solid var(--line)}
.seg .s-ok.on{background:var(--ok);color:#fff}
.seg .s-no.on{background:var(--no);color:#fff}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--nobg);color:var(--no)}.pill.wait{background:var(--waitbg);color:var(--wait)}.pill.mute{background:var(--line2);color:var(--muted)}
.chk{flex:0 0 auto;width:54px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:22px;color:transparent;font-weight:700}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.sms{flex:0 0 auto;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink2);font-size:16px;background:#fff}
.lb-l{font-size:13px;color:var(--muted);font-weight:700}
.lb-u{font-size:13px;word-break:break-all;color:var(--ink2);margin:4px 0 10px;padding:8px 10px;background:var(--paper);border-radius:8px}
.ct{font:700 16px var(--serif);margin-bottom:6px}
.tpl-ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.55;background:var(--paper);margin-bottom:8px;resize:vertical}
#imgout img{width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line);display:block}
.kv{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;font-size:15px;margin:0}
.warn{padding:10px 12px;border-radius:10px;background:var(--waitbg);color:var(--wait);font-size:14px;margin:8px 0}
.gocard{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:12px;border:1px solid #EFC9C4;background:var(--nobg);color:var(--no);font-weight:700;font-size:15px}
details.how{margin-top:12px;font-size:14px;color:var(--ink2)}
details.how summary{cursor:pointer;font-weight:700;color:var(--ink);padding:6px 0}
details.how ol{margin:6px 0 0;padding-left:20px}
details.how li{margin:4px 0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;white-space:pre-line}
.adm-login{max-width:420px;margin:0 auto;padding:24px 16px}
.adm-login h2{font:700 20px var(--serif);margin:0 0 6px}
.link{display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:14px}

/* ───── 회원 카드 · 회원 소개 ───── */
.jbanner{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border-radius:var(--r);border:1px solid var(--gold2);background:linear-gradient(135deg,#FFFDF8 0%,#F6EEDC 100%);box-shadow:var(--sh);color:var(--ink);margin-bottom:6px}
.jbanner.sm{padding:12px 14px}
.jb-t{flex:1;min-width:0;display:block}
.jb-t b{display:block;font:700 18px/1.35 var(--serif)}
.jbanner.sm .jb-t b{font-size:16px}
.jb-t span{display:block;font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.45}
.jb-go{flex:0 0 auto;font-weight:700;color:#fff;background:var(--gold);padding:8px 13px;border-radius:999px;font-size:14px;white-space:nowrap}
.flinks{display:flex;justify-content:center;gap:18px;margin-bottom:12px}
.flinks button{border:0;background:none;color:var(--gold);font-weight:700;font-size:14px;padding:4px 0}
.jhero h1{margin-bottom:4px}
.jhero p{position:relative;margin:10px 0 0;color:#ECE7DB;font-size:16px;line-height:1.6}
.jhero p b{color:var(--gold2)}
.jprog{position:relative;margin:18px auto 0;max-width:320px;font-size:14px;color:#D9D3C4}
.jprog .bar{background:rgba(255,255,255,.16);margin:0 0 8px}
.jprog .bar i{background:var(--gold2)}
.jprog b{color:#fff}
.nm .c-ok{color:var(--ok)}.nm .c-wait{color:var(--wait)}
.nm.done{background:var(--okbg);border-color:#BFE0CD}
.jnew{margin-top:12px;color:var(--ink2);background:var(--paper)}
.jnote{font-size:14px;color:var(--wait);background:var(--waitbg);padding:10px 12px;border-radius:10px;margin:0 0 10px}
.jphoto{display:flex;gap:14px;align-items:center;margin:4px 0 6px}
.pframe{flex:0 0 108px;height:135px;border-radius:12px;border:1.5px dashed var(--gold2);background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:14px}
.pframe img{width:100%;height:100%;object-fit:cover;display:block}
.pact{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.pact .hint{margin:0}
.pact label.btn{position:relative;overflow:hidden}
.chk2{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;cursor:pointer}

.chk2 b{display:block;font-size:16px;line-height:1.35}
.chk2 small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.45}
.agree{margin-top:14px;padding-top:8px;border-top:1px solid var(--line)}
.agree .chk2{border-color:var(--gold2);background:var(--goldbg)}
.agree ul{margin:6px 0 0;padding-left:18px}
.agree li{margin:3px 0}
.hp{position:absolute!important;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
.pact label.btn .hp{left:0;top:0;width:100%;height:100%;opacity:0;pointer-events:auto;cursor:pointer}
.jshare{margin-top:16px;padding:14px;border-radius:12px;background:var(--paper);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.jshare p{flex:1 0 100%;margin:0;font-size:14px;color:var(--ink2);font-weight:700}

.psub{text-align:center;color:var(--ink2);margin:0 0 14px;font-size:15px}

.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.dcard{display:flex;flex-direction:column;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 9px 12px;box-shadow:var(--sh);min-width:0}

.dph{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--paper);display:flex;align-items:center;justify-content:center}

.dph span{font:700 38px/1 var(--serif);color:var(--tc);opacity:.45}

.cph{flex:0 0 44px;height:55px;border-radius:8px;overflow:hidden;background:var(--paper);display:flex;align-items:center;justify-content:center;font:700 18px var(--serif);color:var(--muted)}

/* 아래에서 올라오는 창 */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.on{display:block}
.ov{position:absolute;inset:0;background:rgba(15,18,30,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-width:640px;margin:0 auto;animation:up .18s ease-out}

.movebar{display:block;padding:11px 16px;background:#A47622;color:#fff;font-weight:700;font-size:14px;text-align:center;text-decoration:none}
body.pubmode #toast{bottom:28px}

/* 화면이 멈추면 원인을 화면에 보여 줍니다(로딩 표시만 남는 일을 막음) */
(function () {
  var shown = false, last = '';
  function show(msg) {
    last = String(msg || '').slice(0, 400);
    var app = document.getElementById('app');
    if (!app || shown) return;
    if (!app.querySelector('.loading') && msg !== '__timeout__') return;
    shown = true;
    app.innerHTML = '<div style="max-width:520px;margin:40px auto;padding:20px;font:15px/1.6 sans-serif;color:#1A2036;text-align:center">'
      + '<div style="font-size:18px;font-weight:700;margin-bottom:8px">화면을 여는 중에 문제가 생겼습니다</div>'
      + '<div style="color:#4A4F63">잠시 뒤 다시 열어 주세요. 계속되면 아래 내용을 문의처에 알려 주세요.</div>'
      + '<button onclick="location.reload()" style="margin:16px 0;padding:10px 18px;border:0;border-radius:10px;background:#1A2036;color:#fff;font-size:15px">다시 열기</button>'
      + '<div id="errbox" style="font:12px/1.5 monospace;color:#9A2B2B;word-break:break-all;text-align:left;background:#fff;border:1px solid #E4DCCB;border-radius:8px;padding:10px"></div></div>';
    document.getElementById('errbox').textContent = msg === '__timeout__' ? (last && last !== '__timeout__' ? last : '응답 시간 초과') : last;
  }
  window.addEventListener('error', function (e) { show((e.message || '오류') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')); });
  window.addEventListener('unhandledrejection', function (e) { show('promise: ' + ((e.reason && (e.reason.message || e.reason)) || '')); });
  setTimeout(function () { var app = document.getElementById('app'); if (app && app.querySelector('.loading') && !window.__booted) show('__timeout__'); }, 12000);
})();
</script>

<script>
(function () {
'use strict';
const B = window.BOOT || {};
const app = document.getElementById('app');
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const TEAM_COLOR = { 1: 'var(--red)', 2: 'var(--blue)', 3: 'var(--yellow)', 0: 'var(--muted)' };
const ROLE_ORDER = { '조장': 0, '반장': 1, '계원': 2 };

/* ───────── 작은 도구 ───────── */
const h = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const won = n => (Number(n) || 0).toLocaleString('ko-KR') + '원';
const pd = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };
const dShort = s => { const d = pd(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]})` : (s || ''); };
const dLong = s => { const d = pd(s); return d ? `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일` : (s || ''); };
const tKo = t => { const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return t || ''; const H = +m[1], M = +m[2], hh = H % 12 === 0 ? 12 : H % 12; return `${H < 12 ? '오전' : '오후'} ${hh}시${M ? ' ' + M + '분' : ''}`; };
const dday = (s, today) => { const d = pd(s), t = pd(today); if (!d || !t) return ''; const n = Math.round((d - t) / 864e5); return n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : '지난 행사'; };
const shortTs = s => { const m = String(s || '').match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/); return m ? `${+m[1]}/${+m[2]} ${m[3]}` : (s || ''); };
const teamName = (no, site) => { no = Number(no) || 0; const n = site && site.teams && site.teams[no]; return no ? `${no}조${n ? ' ' + n : ''}` : '조 없음'; };
const teamNo = m => { const n = Number(m.team); return n >= 1 && n <= 3 ? n : 0; };
const errMsg = e => String((e && e.message) || e || '오류가 났습니다.').replace(/^(Exception|Error|ScriptError):\s{0,9}/, '');

const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 없음 */ } };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* 없음 */ } };

const nowStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; };
const telLinks = s => h(s).replace(/(01[016789][-\s.]?\d{3,4}[-\s.]?\d{4}|0\d{1,2}-\d{3,4}-\d{4})/g, m => `<a href="tel:${m.replace(/\D/g, '')}" target="_blank">${m}</a>`);
const loadingHtml = t => `<div class="loading"><div class="spin"></div>${h(t || '불러오는 중…')}</div>`;
const sortMembers = list => list.slice().sort((a, b) => (teamNo(a) || 9) - (teamNo(b) || 9) || ((ROLE_ORDER[a.role] != null ? ROLE_ORDER[a.role] : 2) - (ROLE_ORDER[b.role] != null ? ROLE_ORDER[b.role] : 2)) || ((Number(a.order) || 999) - (Number(b.order) || 999)));

// 구글 주소에서 열리면 google.script.run, 깃허브 주소에서 열리면 서버 주소(API_URL)로 자료를 주고받습니다
const IN_GAS = !!(window.google && google.script && google.script.run);
const API_URL = window.API_URL || '';
function apiFetch(fn, args, left) {
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
    .then(r => { if (!r.ok) throw new Error('서버 응답 오류 (' + r.status + ')'); return r.json(); })
    .then(o => { if (!o || !o.ok) { const e = new Error((o && o.error) || '오류가 났습니다.'); e.server = true; throw e; } return o.result; })
    .catch(e => { if (!e.server && left > 0) return new Promise(ok => setTimeout(ok, 900)).then(() => apiFetch(fn, args, left - 1)); throw e.server ? e : new Error('인터넷 연결을 확인해 주세요.'); });
}
function api(fn, ...args) {
  if (IN_GAS) return new Promise((resolve, reject) => google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));
  if (!API_URL) return Promise.reject(new Error('서버에 연결할 수 없습니다.'));
  return apiFetch(fn, args, 1);
}

let toastT = null;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2300);
}

function copyText(text) {
  const done = () => toast('복사했어요');
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { ta.setSelectionRange(0, text.length); } catch (e) { /* 없음 */ }
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) done();
    else openSheet('복사하기', `<p class="hint">아래 글을 길게 눌러 전체 선택한 뒤 복사해 주세요.</p><textarea class="tpl-ta" rows="12" readonly>${h(text)}</textarea>`);
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback);
  else fallback();
}

function openSheet(title, body, opt) {
  opt = opt || {};
  const root = document.getElementById('sheet-root');
  root.innerHTML = `<div class="ov" data-close></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${h(title)}">
    <div class="sheet-h"><b>${h(title)}</b><button class="x" data-close aria-label="닫기">✕</button></div>
    <div class="sheet-b">${body}</div>${opt.foot ? `<div class="sheet-f">${opt.foot}</div>` : ''}</div>`;
  root.classList.add('on'); document.body.classList.add('lock');
  root.onclick = e => { if (e.target.closest('[data-close]')) closeSheet(); };
  return root.querySelector('.sheet');
}
function closeSheet() {
  const root = document.getElementById('sheet-root');
  root.classList.remove('on'); root.innerHTML = ''; document.body.classList.remove('lock');
}

/* ───────── 이름 찾기(붙여넣기 분석) ───────── */
const HANGUL = /[가-힣]/;
const NAME_TAIL2 = '님씨은는이가도요입참불회부선께와랑만';
function findNames(text, members) {
  const list = members.slice().sort((a, b) => b.name.length - a.name.length);
  const out = [];
  list.forEach(m => {
    const n = m.name;
    if (!n) return;
    let i = text.indexOf(n);
    while (i !== -1) {
      const prev = i > 0 ? text[i - 1] : '', next = text[i + n.length] || '';
      let ok = true;
      if (n.length <= 2) {
        if (prev && HANGUL.test(prev) && prev !== '조' && prev !== '팀') ok = false;
        if (ok && next && HANGUL.test(next) && NAME_TAIL2.indexOf(next) < 0) ok = false;
      }
      if (ok && !out.some(f => i < f.e && i + n.length > f.s)) out.push({ m: m, s: i, e: i + n.length });
      i = text.indexOf(n, i + 1);
    }
  });
  return out.sort((a, b) => a.s - b.s);
}
const RE_NO = /(불참|불가|못\s*(가|갑|감|갈|와|옵|올|참|할|합|해|하겠)|어렵|어려울|빠지|빠질|빠집|결석|패스|다음\s*기회|안\s*(가|갑|감|갈))/;
const RE_YES = /(참석|참가|참여|출석|갑니다|가요|갈게|갈께|가겠|갈\s*수\s*있|가능|오케이|ㅇㅋ|\bok\b|콜|👍|⭕)/i;
const RE_ASK = /(참석\s*여부|알려\s*주(세요|시기|십|셔)|부탁\s*드|하실\s*분|오실\s*분|가실\s*분|회신\s*(부탁|주세요|바랍|해\s*주))/;
const RE_STRONG = /(참석합니다|참석할게|참석하겠|참석해요|참석이요|참석요|갑니다|갈게요|가겠습니다|불참합니다|불참할게|불참이요|못\s*갑니다|못\s*가요|못\s*갈\s*것)/;
const RE_ME = /(저도|저랑|제가|저희|나도|우리|둘\s*다|같이|함께)/;
function splitKakao(line) {
  let m = line.match(/^\[([^\]]{1,30})\]\s*\[[^\]]{1,20}\]\s*(.*)$/);
  if (m) return { sender: m[1], body: m[2] };
  m = line.match(/^\d{4}\s*[.년]\s*\d{1,2}\s*[.월]\s*\d{1,2}\s*[.일]?\s*[^,]{0,20},\s*([^:]{1,30}?)\s*:\s*(.*)$/);
  if (m) return { sender: m[1], body: m[2] };
  return { sender: '', body: line };
}
function parseRsvp(text, members) {
  const res = new Map(), unknown = [];
  let mode = '';
  String(text || '').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) { mode = ''; return; }
    const k = splitKakao(line);
    const kw = RE_NO.test(k.body) ? '불참' : RE_YES.test(k.body) ? '참석' : '';
    let names = findNames(k.body, members);
    const senderNames = k.sender ? findNames(k.sender, members) : [];
    if (!names.length) names = senderNames;
    else if (senderNames.length && RE_ME.test(k.body)) names = names.concat(senderNames);
    if (!names.length) { if (kw && !k.sender) mode = kw; else if (kw) unknown.push(line); return; }
    if (RE_ASK.test(k.body) && !RE_STRONG.test(k.body)) { unknown.push(line); return; }
    const st = kw || mode;
    if (!st) { unknown.push(line); return; }
    names.forEach(f => res.set(f.m.id, { m: f.m, attend: st, line: line }));
  });
  return { items: Array.from(res.values()), unknown: unknown };
}

function parseVaccts(text, members, allMembers) {
  const owner = {};
  allMembers.forEach(m => { const d = String(m.vacct || '').replace(/\D/g, ''); if (d) owner[d] = m; });
  const named = [], bare = [], unknown = [], used = {};
  String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
    const acc = accIn(line);
    if (!acc) return;
    const d = acc.replace(/\D/g, '');
    if (d.length < 8 || used[d]) return;
    used[d] = 1;
    const rest = line.replace(acc, ' ').replace(/01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/g, ' ');
    const names = findNames(rest, members);
    if (names.length === 1) named.push({ m: names[0].m, acc: acc, d: d, line: line });
    else if (!names.length && !/[가-힣]{2,}/.test(rest.replace(BANK_WORDS, ''))) bare.push({ acc: acc, d: d, line: line });
    else unknown.push(line);
  });
  const items = [], taken = {};
  named.forEach(x => { if (!taken[x.m.id]) { taken[x.m.id] = 1; items.push(x); } });
  const free = sortMembers(members).filter(m => !m.vacct && !taken[m.id]);
  let fi = 0;
  bare.forEach(x => {
    if (owner[x.d]) { unknown.push(`${x.acc} — 이미 ${owner[x.d].name} 님 계좌`); return; }
    const m = free[fi++];
    if (m) { taken[m.id] = 1; items.push(Object.assign({ m: m, auto: true }, x)); } else unknown.push(`${x.acc} — 남는 계좌`);
  });
  items.forEach(it => {
    const o = owner[it.d];
    it.conflict = o && o.id !== it.m.id ? o.name : '';
    it.same = String(it.m.vacct || '').replace(/\D/g, '') === it.d;
  });
  return { items: items, unknown: unknown };
}
const RE_PHONE = /01[016789][-.\s]?\d{3,4}[-.\s]?\d{4}/;
function parseContacts(text, members) {
  const lines = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  const items = [], unknown = [], seen = {};
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    let ph = line.match(RE_PHONE);
    let names = findNames(line, members);
    let src = line;
    if (names.length && !ph && lines[i + 1] && RE_PHONE.test(lines[i + 1]) && !findNames(lines[i + 1], members).length) { ph = lines[i + 1].match(RE_PHONE); src = line + ' ' + lines[i + 1]; i++; }
    if (!ph) continue;
    if (names.length !== 1) { unknown.push(src); continue; }
    const m = names[0].m;
    if (seen[m.id]) continue;
    seen[m.id] = 1;
    items.push({ m: m, phone: ph[0].replace(/\D/g, '').replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3'), line: src });
  }
  return { items: items, unknown: unknown };
}

const P = { home: null, data: null, team: 1, q: '', sel: null, verified: false, my: null, editing: false, busy: false, last4: '' };

function histPush(params) {
  if (IN_GAS) { try { google.script.history.push(null, params, ''); } catch (e) { /* 없음 */ } return; }
  const q = Object.keys(params || {}).map(k => params[k] === '' ? encodeURIComponent(k) : encodeURIComponent(k) + '=' + encodeURIComponent(params[k])).join('&');
  try { history.pushState(params || {}, '', location.pathname + (q ? '?' + q : '')); } catch (e) { /* 없음 */ }
}
function qsParams() { const p = {}; try { new URLSearchParams(location.search).forEach((v, k) => { p[k] = v; }); } catch (e) { /* 없음 */ } return p; }
function routeTo(p) {
  if (p.e) openEvent(p.e, false);
  else if ('join' in p) openJoin(false);
  else if ('members' in p) openDir(false);
  else goHome(false);
}

const isClosed = ev => ev.status === '마감' || ev.status === '완료';

function renderReply() {
  const box = document.getElementById('rbox');
  if (!box || !P.data) return;
  const ev = P.data.event;
  if (!P.sel) {
    box.innerHTML = isClosed(ev) ? `<div class="closed">회신이 마감되었습니다.<br>바꾸실 일이 있으면 총무에게 연락해 주세요.</div>` : pickHtml();
    return;
  }
  const m = P.sel;
  let html = `<div class="me"><div><b>${h(m.name)}</b> 님<small>${h(teamName(m.tno, P.data.site))}</small></div><button data-pa="unpick">다른 이름 고르기</button></div>`;
  if (m.lock && !P.verified) {
    html += `<label class="field"><span>본인 확인 — 휴대폰 번호 뒷 4자리</span><input id="l4" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0000"></label>
      <div id="rerr" class="err"></div><button class="btn primary block" data-pa="verify">확인</button>`;
    box.innerHTML = html;
    setTimeout(() => { const i = document.getElementById('l4'); if (i) i.focus(); }, 60);
    return;
  }
  if (!P.my) { box.innerHTML = html + loadingHtml('회신 내용을 확인하는 중…').replace('class="loading"', 'class="loading sm"'); return; }
  const my = P.my;
  if (my.attend && !P.editing) {
    html += `<div class="status ${my.attend === '참석' ? 'yes' : 'no'}">${my.attend === '참석' ? '✓ 참석으로 회신했습니다' : '불참으로 회신했습니다'}<small>${h(shortTs(my.rsvpAt))}${my.rsvpMemo ? ' · ' + h(my.rsvpMemo) : ''}</small></div>`;
    if (my.attend === '참석' && ev.fee) html += payBoxHtml(my, ev);
    if (!isClosed(ev)) html += `<button class="btn block" data-pa="edit" style="margin-top:12px">회신 바꾸기</button>`;
  } else if (isClosed(ev)) {
    html += `<div class="closed">회신이 마감되었습니다.</div>`;
  } else {
    html += `<p class="step">참석 여부를 눌러 주세요</p>
      <div class="big2"><button class="bigbtn yes" data-rsvp="참석">참석합니다</button><button class="bigbtn no" data-rsvp="불참">불참합니다</button></div>
      <label class="field"><span>한마디 (선택)</span><input id="memo" maxlength="100" placeholder="예: 조금 늦을 것 같아요" value="${h(my.rsvpMemo || '')}"></label>
      <div id="rerr" class="err"></div>`;
  }
  box.innerHTML = html;
}

function vaccBox(my, nm) {
  return `<div class="vacc"><div class="vl">${h(nm)} 님 전용 입금 계좌</div>${my.vbank ? `<div class="vb">${h(my.vbank)}</div>` : ''}<div class="vn">${h(my.vacct)}</div>${my.vholder ? `<div class="vh">예금주 ${h(my.vholder)}</div>` : ''}</div>`;
}
function payBoxHtml(my, ev) {
  if (!DUES_TRACK) return `<div class="payline"><div>회비 <b>${won(ev.fee)}</b>${ev.account ? `<br><span class="ph">${h(ev.account)}</span>` : ''}</div>${ev.account ? `<div class="row2" style="margin-top:10px"><button class="btn sm" data-copy="${h(ev.account)}">계좌 복사</button></div>` : ''}</div>`;
  const nm = P.sel ? P.sel.name : '';
  if (my.pay === '확인') return `<div class="payline"><b class="ok">✓ 회비 입금 확인됨</b>${my.amount ? ' · ' + won(my.amount) : ''}</div>`;
  if (my.vacct) {
    const full = [my.vbank, my.vacct].filter(Boolean).join(' ');
    if (my.pay === '알림') return `<div class="payline">입금했다고 알렸습니다. 통장에 들어온 것이 확인되면 <b>입금 확인</b>으로 바뀝니다.${vaccBox(my, nm)}</div>`;
    return `<div class="payline"><div>회비 <b>${won(ev.fee)}</b>을 아래 계좌로 보내 주세요.</div>${vaccBox(my, nm)}
      <p class="vnote">${h(nm)} 님만의 계좌라 입금자 이름이 달라도(가족 이름 등) ${h(nm)} 님 입금으로 확인됩니다.</p>
      <div class="row2" style="margin-top:10px"><button class="btn sm primary" data-copy="${h(full)}">계좌 복사</button><button class="btn sm ghost" data-pa="paid">입금했어요</button></div></div>`;
  }
  if (my.pay === '알림') return `<div class="payline">입금했다고 알렸습니다. 총무님이 통장을 확인하면 <b>입금 확인</b>으로 바뀝니다.</div>`;
  return `<div class="payline"><div>회비 <b>${won(ev.fee)}</b>${ev.account ? `<br><span class="ph">${h(ev.account)}</span>` : ''}</div>
    <div class="row2" style="margin-top:10px">${ev.account ? `<button class="btn sm" data-copy="${h(ev.account)}">계좌 복사</button>` : ''}<button class="btn sm gold" data-pa="paid">입금했어요</button></div></div>`;
}

function pickHtml() {
  const d = P.data;
  const tabs = d.teams.filter(t => t.members.length).map(t => `<button class="tt ${P.team === t.no ? 'on' : ''}" data-team="${t.no}" style="--tc:${TEAM_COLOR[t.no] || TEAM_COLOR[0]}"><i></i>${h(teamName(t.no, d.site))}</button>`).join('');
  return `<p class="step">내 이름을 눌러 주세요</p><div class="ttabs">${tabs}</div>
    <input class="search" type="search" placeholder="이름으로 찾기" value="${h(P.q)}" data-pq aria-label="이름으로 찾기">
    <div class="ngrid" id="ngrid">${gridHtml()}</div>`;
}

function gridHtml() {
  const d = P.data, q = P.q.trim();
  let list = [];
  if (q) d.teams.forEach(t => t.members.forEach(m => { if (m.name.indexOf(q) >= 0) list.push(Object.assign({ tno: t.no }, m)); }));
  else { const t = d.teams.filter(x => x.no === P.team)[0] || d.teams[0]; list = t ? t.members.map(m => Object.assign({ tno: t.no }, m)) : []; }
  return list.map(m => `<button class="nm" data-pick="${h(m.id)}">${h(m.name)}${m.role && m.role !== '계원' ? `<small>${h(m.role)}</small>` : ''}</button>`).join('')
    || '<div class="empty" style="grid-column:1/-1">이름을 찾지 못했어요.</div>';
}

function findPubMember(id) {
  for (const t of P.data.teams) for (const m of t.members) if (m.id === id) return Object.assign({ tno: t.no }, m);
  return null;
}

function pick(id, last4, quiet) {
  const m = findPubMember(id);
  if (!m) return;
  Object.assign(P, { sel: m, verified: !m.lock, my: null, editing: false, last4: '' });
  renderReply();
  if (!quiet) { const r = document.getElementById('reply'); if (r) r.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  if (!m.lock) loadMy();
  else if (last4) verify(last4, true);
}

async function loadMy() {
  try {
    P.my = await api('pub_my', P.data.event.id, P.sel.id, P.last4);
    lsSet('bih_me', JSON.stringify({ id: P.sel.id, l4: P.last4 }));
  } catch (e) { P.my = {}; setTimeout(() => showErr(errMsg(e)), 0); }
  renderReply();
}

async function verify(val, silent) {
  const v = String(val || (document.getElementById('l4') || {}).value || '').replace(/\D/g, '');
  if (v.length !== 4) { showErr('뒷 4자리를 입력해 주세요.'); return; }
  try {
    const my = await api('pub_my', P.data.event.id, P.sel.id, v);
    Object.assign(P, { last4: v, verified: true, my: my });
    lsSet('bih_me', JSON.stringify({ id: P.sel.id, l4: v }));
    renderReply();
  } catch (e) {
    if (silent) { lsDel('bih_me'); renderReply(); } else showErr(errMsg(e));
  }
}

function showErr(t) { const el = document.getElementById('rerr'); if (el) el.textContent = t; else toast(t); }

async function sendRsvp(attend) {
  if (P.busy) return;
  P.busy = true;
  const memo = (document.getElementById('memo') || {}).value || '';
  document.querySelectorAll('[data-rsvp]').forEach(b => { b.disabled = true; if (b.getAttribute('data-rsvp') === attend) b.classList.add('sel'); });
  try {
    const r = await api('pub_rsvp', P.data.event.id, P.sel.id, attend, memo, P.last4);
    Object.assign(P, { my: r.my, editing: false });
    P.data.counts = r.counts;
    const c = document.getElementById('cnt'); if (c) c.innerHTML = cntHtml(r.counts);
    lsSet('bih_me', JSON.stringify({ id: P.sel.id, l4: P.last4 }));
    renderReply();
    toast(attend === '참석' ? '참석으로 회신했습니다' : '불참으로 회신했습니다');
  } catch (e) {
    showErr(errMsg(e));
    document.querySelectorAll('[data-rsvp]').forEach(b => { b.disabled = false; b.classList.remove('sel'); });
  } finally { P.busy = false; }
}

async function sendPaid() {
  if (P.busy) return;
  P.busy = true;
  try { const r = await api('pub_paid', P.data.event.id, P.sel.id, P.last4, ''); P.my = r.my; renderReply(); toast('입금했다고 알렸습니다'); }
  catch (e) { toast(errMsg(e)); }
  finally { P.busy = false; }
}

function autoPick() {
  let me = null;
  try { me = JSON.parse(lsGet('bih_me') || 'null'); } catch (e) { me = null; }
  if (me && me.id && findPubMember(me.id)) pick(me.id, me.l4 || '', true);
}

function onPubClick(e) {
  const t = e.target;
  let el;
  if (onJoinClick(t)) return;
  if ((el = t.closest('[data-ev]'))) { openEvent(el.getAttribute('data-ev'), true); return; }
  if ((el = t.closest('[data-pa]'))) {
    const a = el.getAttribute('data-pa');
    if (onJoinAction(a)) return;
    if (a === 'home') goHome(true);
    else if (a === 'unpick') { Object.assign(P, { sel: null, my: null, verified: false, editing: false }); lsDel('bih_me'); renderReply(); }
    else if (a === 'verify') verify();
    else if (a === 'edit') { P.editing = true; renderReply(); }
    else if (a === 'paid') sendPaid();
    return;
  }
  if ((el = t.closest('[data-team]'))) { P.team = Number(el.getAttribute('data-team')); P.q = ''; renderReply(); return; }
  if ((el = t.closest('[data-pick]'))) { pick(el.getAttribute('data-pick')); return; }
  if ((el = t.closest('[data-rsvp]'))) { sendRsvp(el.getAttribute('data-rsvp')); }
}

/** 고른 사진을 4:5로 잘라 작게 줄입니다(긴 사진은 얼굴이 있는 위쪽 가까이) */
function cropPhoto(img, W, H) {
  const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height, r = W / H;
  let cw = sw, ch = sw / r;
  if (ch > sh) { ch = sh; cw = sh * r; }
  const sx = (sw - cw) / 2, sy = Math.max(0, (sh - ch) * 0.3);
  // 큰 사진은 두 번에 나눠 줄여야 글자·머리카락이 덜 뭉개집니다
  const mid = document.createElement('canvas');
  mid.width = W * 2; mid.height = H * 2;
  const mg = mid.getContext('2d');
  mg.imageSmoothingQuality = 'high';
  mg.drawImage(img, sx, sy, cw, ch, 0, 0, mid.width, mid.height);
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
  g.imageSmoothingQuality = 'high';
  g.drawImage(mid, 0, 0, W, H);
  let q = 0.86, out = cv.toDataURL('image/jpeg', q);
  while (out.length > 40000 && q > 0.45) { q -= 0.08; out = cv.toDataURL('image/jpeg', q); }
  return out;
}

async function pickPhoto(file) {
  if (!file) return;
  if (file.type && !/^image\//.test(file.type)) { toast('사진 파일을 골라 주세요'); return; }
  keepJoinForm();
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    J.photo = cropPhoto(img, 270, 338);
    J.keep.dropPhoto = false;
    renderJoinBox();
  } catch (e) { toast('이 사진은 열 수 없어요. 다른 사진을 골라 주세요'); }
  finally { URL.revokeObjectURL(url); }
}

async function sendCard(form) {
  if (J.busy) return;
  keepJoinForm();
  const k = J.keep, err = document.getElementById('jerr');
  const say = t => { if (err) { err.textContent = t; err.scrollIntoView({ behavior: 'smooth', block: 'center' }); } else toast(t); };
  if (String(k.name || '').replace(/\s/g, '').length < 2) { say('이름을 넣어 주세요.'); return; }
  if (!/^01\d{8,9}$/.test(String(k.phone || '').replace(/\D/g, ''))) { say('휴대폰 번호를 확인해 주세요. 예: 010-1234-5678'); return; }
  if (!k.agree) { say('개인정보 수집·이용에 동의해 주세요.'); return; }
  const btn = document.getElementById('jsend');
  J.busy = true; if (btn) { btn.disabled = true; btn.textContent = '내는 중…'; }
  const o = Object.assign({}, k, { memberId: J.sel ? J.sel.id : '', photo: J.photo || '', website: form.elements.website ? form.elements.website.value : '' });
  if (!J.sel) o.team = k.team || '';
  try {
    const r = await api('pub_saveCard', o);
    J.done = Object.assign({ r: r }, o);
    lsSet('bih_card', JSON.stringify({ id: r.id, name: r.name, at: nowStr() }));
    renderJoinBox();
    const b = document.getElementById('jbox'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    say(errMsg(e));
    if (btn) { btn.disabled = false; btn.textContent = '회원 카드 내기'; }
  } finally { J.busy = false; }
}

  let el;

  if ((el = t.closest('[data-jpick]'))) {
    const m = joinFind(el.getAttribute('data-jpick'));
    if (!m) return true;
    Object.assign(J, { sel: m, isNew: false, keep: {}, photo: '' });
    renderJoinBox();
    const b = document.getElementById('jbox'); if (b) b.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return true;
  }
  if ((el = t.closest('[data-dteam]'))) {
    DIR.team = Number(el.getAttribute('data-dteam'));
    document.querySelectorAll('[data-dteam]').forEach(b => b.classList.toggle('on', b === el));

  if ((el = t.closest('[data-dc]'))) { openDirCard(el.getAttribute('data-dc')); return true; }

}

    case 'junpick': Object.assign(J, { sel: null, isNew: false, keep: {}, photo: '' }); renderJoinBox(); return true;
    case 'jnophoto': keepJoinForm(); J.photo = ''; J.keep.dropPhoto = true; renderJoinBox(); return true;
    case 'jagain': Object.assign(J, { sel: null, isNew: false, keep: {}, photo: '', done: null }); renderJoinBox(); window.scrollTo(0, 0); return true;
    default: return false;
  }
}

const isAuth = e => /AUTH/.test(errMsg(e));
const part = (eid, mid) => (IDX.parts[eid] || {})[mid];
const activeMembers = () => S.D.members.filter(m => !m.status || m.status === '활동');
const curEv = () => S.D.events.filter(e => e.id === S.evId)[0];
const inviteUrl = ev => (S.D.base || B.base) + '?e=' + encodeURIComponent(ev.id);
const evTitle = id => { const e = S.D.events.filter(x => x.id === id)[0]; return e ? e.title : ''; };
const isPending = d => d.state === '미확인' || d.state === '확인대기';
const pendingDeps = () => (S.D.deposits || []).filter(isPending);
const vacctFull = m => [S.D.site.vbank, m.vacct].filter(Boolean).join(' ');
const vacctOn = () => activeMembers().some(m => String(m.vacct || '').replace(/\D/g, '').length >= 8);
// 전용 계좌(가상계좌) 기능은 설정에서 은행을 넣거나 전용 계좌가 생기면 켜집니다 — 그 전에는 관련 화면을 숨김
const vacctMode = () => !!(S.D.site && S.D.site.vbank) || vacctOn();
const val = (root, sel) => { const el = root.querySelector(sel); return el ? el.value : ''; };

function index() {
  IDX.mem = {};
  S.D.members.forEach(m => { IDX.mem[m.id] = m; });
  IDX.parts = {};
  S.D.parts.forEach(p => { (IDX.parts[p.eventId] = IDX.parts[p.eventId] || {})[p.memberId] = p; });
}

function stats(ev) {
  const ps = IDX.parts[ev.id] || {};
  const st = { total: 0, yes: 0, no: 0, none: 0, paid: 0, notified: 0, unpaid: 0, unconfirmed: 0, paidSum: 0, att: 0 };
  activeMembers().forEach(m => {
    const p = ps[m.id] || {};
    st.total++;
    if (p.attend === '참석') st.yes++; else if (p.attend === '불참') st.no++; else st.none++;
    if (p.pay === '확인') { st.paid++; st.paidSum += Number(p.amount) || 0; } else if (p.pay === '알림') st.notified++;
    if (p.attend === '참석' && !p.pay) st.unpaid++;
    if (p.attend === '참석' && p.pay !== '확인') st.unconfirmed++;
    if (p.att) st.att++;
  });
  return st;
}

async function admStart() {
  S.token = lsGet('bih_tok');
  if (!S.token) { showLogin(); return; }
  app.innerHTML = loadingHtml('관리 화면을 여는 중…');
  try { S.D = await api('adm_load', S.token); index(); renderAdm(); }
  catch (e) { if (isAuth(e)) { lsDel('bih_tok'); showLogin(); } else showLogin(errMsg(e)); return; }
  loadCards(false);
}

function showLogin(err) {
  const site = B.site || { name: '백인회' };
  app.innerHTML = `<main class="adm-login">${brandHtml(site.name)}
    <form id="lf" class="card"><h2>임원 관리</h2><p class="hint">${DUES_TRACK ? '행사 안내·참석 회신·회비 입금을 관리합니다.' : '행사 안내·참석 회신·출석을 관리합니다.'}</p>
      <label class="field"><span>관리자 비밀번호</span><input type="password" id="pw" autocomplete="current-password" required></label>
      <div class="err" id="lerr">${err ? h(err) : ''}</div>
      <button class="btn primary block" type="submit">들어가기</button></form>
    <a class="link" href="${h(B.base)}" target="_top">회원용 홈페이지로 가기</a></main>`;
}

async function doLogin(form) {
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = '확인 중…';
  try { S.token = await api('adm_login', form.querySelector('#pw').value); lsSet('bih_tok', S.token); admStart(); }
  catch (e) { document.getElementById('lerr').textContent = errMsg(e); btn.disabled = false; btn.textContent = '들어가기'; }
}

function setSync(st) {
  SYNC.state = st;
  clearTimeout(SYNC.t);
  const el = document.getElementById('sync');
  if (el) el.textContent = st === 'saving' ? '저장 중…' : st === 'ok' ? '저장됨 ✓' : st === 'err' ? '저장 실패' : '';
  if (st === 'ok') SYNC.t = setTimeout(() => setSync(''), 2000);
}

function navBtn(v, label, icon, badge) {
  const on = S.view === v || (v === 'events' && S.view === 'event');
  return `<button class="${on ? 'on' : ''}" data-nav="${v}">${icon}<span>${label}</span>${badge ? `<i class="dot" aria-label="확인 필요 ${badge}건">${badge}</i>` : ''}</button>`;
}

function renderAdm(keepScroll) {
  const y = window.scrollY;
  if (!DUES_TRACK && S.view === 'deposits') S.view = 'events';
  if (!DUES_TRACK && S.sub === 'pay') S.sub = 'rsvp';

      <div class="abar-r"><span class="sync" id="sync"></span><button class="iconbtn" data-a="reload" aria-label="새로고침">⟳</button></div></header>
    ${S.view === 'event' ? evDetailHtml() : `<main class="pad">${({ events: eventsHtml, members: membersHtml, deposits: depositsHtml, files: filesHtml, settings: settingsHtml, join: joinAdmHtml })[S.view]()}</main>`}

function navHtml() {
  return `<nav class="bnav" style="grid-template-columns:repeat(${DUES_TRACK ? 6 : 5},1fr)">${navBtn('events', '행사', ICON.cal)}${navBtn('members', '회원', ICON.users)}${navBtn('join', '가입', ICON.card, pendingCards().length)}${DUES_TRACK ? navBtn('deposits', '입금', ICON.won, pendingDeps().length) : ''}${navBtn('files', '자료', ICON.folder)}${navBtn('settings', '설정', ICON.gear)}</nav>`;
}

async function reloadData(quiet) {
  if (!quiet) setSync('saving');
  try { S.D = await api('adm_load', S.token); index(); renderAdm(true); if (!quiet) setSync('ok'); loadCards(S.view === 'join'); }
  catch (e) { handleErr(e); }

function handleErr(e) {
  if (isAuth(e)) { lsDel('bih_tok'); closeSheet(); showLogin('로그인이 풀렸습니다. 다시 들어가 주세요.'); return; }

}

/* ── 행사 목록 ── */
function eventsHtml() {
  const evs = S.D.events.slice();
  const today = S.D.today;
  const up = evs.filter(e => !e.date || e.date >= today).sort((a, b) => (a.date || '9').localeCompare(b.date || '9'));
  const past = evs.filter(e => e.date && e.date < today).sort((a, b) => b.date.localeCompare(a.date));
  const card = ev => {
    const st = stats(ev);
    const pct = n => st.total ? Math.round(n * 100 / st.total) : 0;
    return `<button class="aev" data-open="${h(ev.id)}">
      <div class="aev-t"><b>${h(ev.title)}</b>${ev.status !== '진행' ? `<span class="tag">${h(ev.status)}</span>` : ''}${ev.date ? `<span class="dday">${h(dday(ev.date, today))}</span>` : ''}</div>
      <div class="aev-m">${h([dShort(ev.date) + (ev.time ? ' ' + tKo(ev.time) : ''), ev.place].filter(Boolean).join(' · '))}</div>
      <div class="aev-s"><span class="ok">참석 ${st.yes}</span><span class="no">불참 ${st.no}</span><span class="wait">미회신 ${st.none}</span>${ev.fee && DUES_TRACK ? `<span class="pay">입금 ${st.paid}/${st.yes}</span>` : ''}</div>
      <div class="bar"><i class="b-ok" style="width:${pct(st.yes)}%"></i><i class="b-no" style="width:${pct(st.no)}%"></i></div>
    </button>`;
  };
  return `<button class="btn primary block" data-a="newEvent">+ 새 행사 만들기</button>
    <h2 class="sec">예정된 행사</h2>${up.length ? up.map(card).join('') : '<div class="empty">예정된 행사가 없습니다.<br>위 버튼으로 행사를 만들면 안내 문구·회신 링크가 바로 생깁니다.</div>'}
    ${past.length ? `<h2 class="sec">지난 행사</h2>${past.map(card).join('')}` : ''}`;
}

/* ── 행사 상세 ── */
function evDetailHtml() {
  const ev = curEv();
  if (!ev) return '<main class="pad"><div class="empty">행사를 찾지 못했습니다.</div></main>';
  const tabs = [['msg', '안내·초대장'], ['rsvp', '참석 회신'], ['pay', '회비'], ['att', '출석'], ['info', '정보']].filter(t => DUES_TRACK || t[0] !== 'pay');
  return `<div class="evhead"><div class="evh-t">${h(ev.title)}${ev.status !== '진행' ? ` <span class="tag">${h(ev.status)}</span>` : ''}</div>
      <div class="evh-m">${h([dShort(ev.date) + (ev.time ? ' ' + tKo(ev.time) : ''), ev.place].filter(Boolean).join(' · '))} ${ev.date ? `<span class="dday">${h(dday(ev.date, S.D.today))}</span>` : ''}</div>
      <div class="subtabs" role="tablist">${tabs.map(([k, l]) => `<button class="st ${S.sub === k ? 'on' : ''}" data-sub="${k}" role="tab">${l}</button>`).join('')}</div></div>
    <main class="pad" id="sub">${subHtml(ev)}</main>`;
}
function subHtml(ev) { return ({ msg: msgHtml, rsvp: rsvpHtml, pay: payHtml, att: attHtml, info: infoHtml })[S.sub](ev); }
function refreshSub() { const el = document.getElementById('sub'); const ev = curEv(); if (el && ev) el.innerHTML = subHtml(ev); }
function refreshList() {
  const ev = curEv(); if (!ev) return;
  const l = document.getElementById('list'); if (l) l.innerHTML = groupedList(ev, S.sub);
  updateSum(ev);
}
function updateSum(ev) {
  const el = document.getElementById('sum');
  if (!el) return;
  el.innerHTML = S.sub === 'rsvp' ? rsvpSum(ev) : S.sub === 'pay' ? paySum(ev) : S.sub === 'att' ? attSum(ev) : '';
}
function updateRow(ev, mid) {
  const el = document.querySelector(`[data-row="${mid}"]`);
  const m = IDX.mem[mid];
  if (el && m) el.outerHTML = rowHtml(ev, m, S.sub);
}

const chips = (mode, arr) => `<div class="chips">${arr.map(([k, l]) => `<button class="chip ${S.f[mode] === k ? 'on' : ''}" data-f="${mode}" data-v="${k}">${h(l)}</button>`).join('')}</div>`;
const roleBadge = m => m.role === '조장' ? '<span class="role r0">조장</span>' : m.role === '반장' ? '<span class="role r1">반장</span>' : '';
const searchBox = (attr, v, ph) => `<input class="search" type="search" placeholder="${h(ph || '이름 검색')}" value="${h(v)}" ${attr} aria-label="${h(ph || '이름 검색')}">`;

function passFilter(ev, m, mode) {
  const p = part(ev.id, m.id) || {};
  const f = S.f[mode];
  if (mode === 'rsvp') return f === 'all' || (f === 'none' && !p.attend) || (f === 'yes' && p.attend === '참석') || (f === 'no' && p.attend === '불참');
  if (mode === 'pay') return f === 'all' || (f === 'yes' && (p.attend === '참석' || !!p.pay)) || (f === 'unpaid' && p.attend === '참석' && !p.pay) || (f === 'noti' && p.pay === '알림') || (f === 'paid' && p.pay === '확인');
  if (mode === 'att') return f === 'all' || (f === 'yes' && (p.attend === '참석' || !!p.att)) || (f === 'in' && !!p.att);
  return true;
}

function groupedList(ev, mode) {
  const site = S.D.site, q = S.q.trim();
  const mem = activeMembers().filter(m => passFilter(ev, m, mode) && (!q || m.name.indexOf(q) >= 0));
  const groups = [1, 2, 3, 0].map(no => ({ no: no, list: mem.filter(m => teamNo(m) === no) })).filter(g => g.list.length);
  if (!groups.length) return '<div class="empty">해당하는 회원이 없습니다.</div>';
  return groups.map(g => `<div class="tgroup"><div class="tgh" style="--tc:${TEAM_COLOR[g.no]}"><i></i>${h(teamName(g.no, site))}<small>${g.list.length}명</small></div>${g.list.map(m => rowHtml(ev, m, mode)).join('')}</div>`).join('');
}

function rowHtml(ev, m, mode) { return mode === 'pay' ? payRow(ev, m) : mode === 'att' ? attRow(ev, m) : rsvpRow(ev, m); }

function remindText(ev, m) {
  return `[${S.D.site.name}] ${m.name}님, ${ev.title}(${dShort(ev.date)}) 참석 여부를 알려 주세요. 아래 링크에서 이름만 누르시면 됩니다.\n${inviteUrl(ev)}`;
}
const smsHref = (phone, body) => `sms:${String(phone).replace(/\D/g, '')}?&body=${encodeURIComponent(body)}`;

function rsvpRow(ev, m) {
  const p = part(ev.id, m.id) || {};
  const a = p.attend || '';
  const sub = a ? [p.rsvpBy === '본인' ? '본인 회신' : p.rsvpBy === '입금' ? '회비 입금으로 참석' : '임원 입력', shortTs(p.rsvpAt), p.rsvpMemo].filter(Boolean).join(' · ') : '미회신';
  return `<div class="mrow" data-row="${h(m.id)}"><div class="mn"><b>${h(m.name)}</b>${roleBadge(m)}<div class="sub">${h(sub)}</div></div>
    ${!a && m.phone ? `<a class="sms" href="${h(smsHref(m.phone, remindText(ev, m)))}" target="_blank" rel="noopener" aria-label="${h(m.name)}님께 문자 보내기">✉</a>` : ''}
    <div class="seg"><button class="s-ok ${a === '참석' ? 'on' : ''}" data-set="attend" data-v="참석" data-m="${h(m.id)}">참석</button><button class="s-no ${a === '불참' ? 'on' : ''}" data-set="attend" data-v="불참" data-m="${h(m.id)}">불참</button></div></div>`;
}
const rsvpSum = ev => { const s = stats(ev); return `<div class="sum ok"><b>${s.yes}</b><span>참석</span></div><div class="sum no"><b>${s.no}</b><span>불참</span></div><div class="sum wait"><b>${s.none}</b><span>미회신</span></div>`; };

function rsvpHtml(ev) {
  return `<div class="sumbar" id="sum">${rsvpSum(ev)}</div>
    <div class="tools"><button class="btn sm" data-a="pasteRsvp">카톡 회신 붙여넣기</button><button class="btn sm ghost" data-a="copyNone">미회신 명단 복사</button></div>
    ${chips('rsvp', [['all', '전체'], ['none', '미회신'], ['yes', '참석'], ['no', '불참']])}
    ${searchBox('data-aq', S.q)}
    <div id="list">${groupedList(ev, 'rsvp')}</div>`;
}

function payText(ev, m) {
  const s = S.D.site, acc = m.vacct ? vacctFull(m) : (ev.account || s.account);
  return lines([`[${s.name}] ${m.name}님, ${ev.title}(${dShort(ev.date)}) 회비 ${won(ev.fee)} 입금 부탁드립니다.`,
    acc ? (m.vacct ? `${m.name}님 전용 계좌: ${acc}${s.vholder ? ' (예금주 ' + s.vholder + ')' : ''}` : `계좌: ${acc}`) : null,
    m.vacct ? '입금자 이름이 달라도 본인 입금으로 확인됩니다.' : null]);
}

function payRow(ev, m) {
  const p = part(ev.id, m.id) || {};
  let pill, btn;
  if (p.pay === '확인') { pill = `<span class="pill ok">입금 확인${p.amount ? ' ' + won(p.amount) : ''}</span>`; btn = `<button class="btn sm ghost" data-paymenu="${h(m.id)}">변경</button>`; }
  else if (p.pay === '알림') { pill = `<span class="pill wait">${/확인 필요/.test(p.payMemo || '') ? '입금 확인 필요' : '입금했다고 알림'}${p.amount ? ' ' + won(p.amount) : ''}</span>`; btn = `<button class="btn sm gold" data-payok="${h(m.id)}">확인</button>`; }
  else { pill = p.attend === '참석' ? '<span class="pill no">미입금</span>' : `<span class="pill mute">${h(p.attend || '미회신')}</span>`; btn = `<button class="btn sm" data-payok="${h(m.id)}">입금 확인</button>`; }
  const extra = [p.payDate ? dShort(p.payDate) : '', p.payMemo].filter(Boolean).join(' · ');
  const nudge = p.attend === '참석' && p.pay !== '확인' && m.phone
    ? `<a class="sms" href="${h(smsHref(m.phone, payText(ev, m)))}" target="_blank" rel="noopener" aria-label="${h(m.name)}님께 회비 안내 문자">✉</a>` : '';
  return `<div class="mrow" data-row="${h(m.id)}"><div class="mn"><b>${h(m.name)}</b>${roleBadge(m)}${m.vacct ? ' <span class="tag" title="전용 입금 계좌 있음">전용계좌</span>' : ''}<div class="sub">${pill}${extra ? ' ' + h(extra) : ''}</div></div>${nudge}${btn}</div>`;
}
const paySum = ev => {
  const s = stats(ev);
  return `<div class="sum gold"><b>${s.paid}</b><span>입금 확인</span></div><div class="sum wait"><b>${s.notified}</b><span>확인 대기</span></div><div class="sum no"><b>${s.unpaid}</b><span>참석자 미입금</span></div>
    <div class="sum wide">입금 합계 <b>${won(s.paidSum)}</b> · 참석 ${s.yes}명 × ${won(ev.fee)} = 예상 ${won(s.yes * (ev.fee || 0))}</div>`;
};

/* ── 초대장 이미지 ── */
function wrapText(g, text, maxW) {
  const out = [];
  String(text || '').split('\n').forEach(para => {
    let line = '';
    para.split(/(\s+)/).forEach(tok => {
      if (!tok) return;
      const t = line + tok;
      if (g.measureText(t).width <= maxW) { line = t; return; }
      if (line.trim()) { out.push(line.trim()); line = ''; }
      tok = tok.trim();
      if (!tok) return;
      if (g.measureText(tok).width <= maxW) { line = tok; return; }
      let part = '';
      Array.from(tok).forEach(ch => { if (g.measureText(part + ch).width > maxW && part) { out.push(part); part = ch; } else part += ch; });
      line = part;
    });
    if (line.trim()) out.push(line.trim());
  });
  return out;
}

/* ── 저장 줄 세우기(빠르게 여러 명을 눌러도 한 번에 저장) ── */
function applyLocal(evId, mid, patch) {
  const m = IDX.mem[mid];
  if (!m) return;
  const map = IDX.parts[evId] = IDX.parts[evId] || {};
  let p = map[mid];
  if (!p) { p = { eventId: evId, memberId: mid, name: m.name, team: m.team }; map[mid] = p; S.D.parts.push(p); }
  const now = nowStr();
  if ('attend' in patch) { p.attend = patch.attend || ''; p.rsvpAt = p.attend ? now : ''; p.rsvpBy = p.attend ? '임원' : ''; if (!p.attend) p.rsvpMemo = ''; }
  if ('pay' in patch) { p.pay = patch.pay || ''; if (!p.pay) { p.amount = ''; p.payDate = ''; p.payMemo = ''; } }
  if (p.pay && 'amount' in patch) p.amount = String(patch.amount || '');
  if (p.pay && 'payDate' in patch) p.payDate = patch.payDate || '';
  if (p.pay && 'payMemo' in patch) p.payMemo = patch.payMemo || '';
  if ('att' in patch) { p.att = patch.att ? 'O' : ''; p.attAt = patch.att ? now : ''; }
}

function queuePatch(evId, mid, patch) {
  applyLocal(evId, mid, patch);
  const m = Q.map[evId] = Q.map[evId] || {};
  m[mid] = Object.assign(m[mid] || {}, patch);
  setSync('saving');
  clearTimeout(Q.timer);
  Q.timer = setTimeout(flush, 700);
}

function replaceParts(evId, rows) {
  S.D.parts = S.D.parts.filter(p => p.eventId !== evId).concat(rows);
  IDX.parts[evId] = {};
  rows.forEach(p => { IDX.parts[evId][p.memberId] = p; });
}

async function flush() {
  if (Q.busy) { clearTimeout(Q.timer); Q.timer = setTimeout(flush, 400); return; }
  const evId = Object.keys(Q.map)[0];
  if (!evId) { setSync('ok'); return; }
  const items = Object.keys(Q.map[evId]).map(mid => ({ memberId: mid, patch: Q.map[evId][mid] }));
  delete Q.map[evId];
  Q.busy = true;
  try {
    const rows = await api('adm_setParts', S.token, evId, items);
    replaceParts(evId, rows);
    if (Q.map[evId]) Object.keys(Q.map[evId]).forEach(mid => applyLocal(evId, mid, Q.map[evId][mid]));
    if (S.view === 'event' && S.evId === evId) updateSum(curEv());
    setSync(Object.keys(Q.map).length ? 'saving' : 'ok');
  } catch (e) {
    handleErr(e);
    reloadData(true);
  } finally {
    Q.busy = false;
    if (Object.keys(Q.map).length) { clearTimeout(Q.timer); Q.timer = setTimeout(flush, 300); }
  }
}

window.addEventListener('beforeunload', e => { if (Object.keys(Q.map).length || Q.busy) { e.preventDefault(); e.returnValue = ''; } });

/** 저장 줄에 남은 것을 먼저 보내고 기다리기(입금 처리처럼 서버에서 직접 바꾸는 일 앞에) */
async function settle() {
  for (let i = 0; i < 80 && (Object.keys(Q.map).length || Q.busy); i++) {
    if (!Q.busy && Object.keys(Q.map).length) { clearTimeout(Q.timer); flush(); }
    await new Promise(r => setTimeout(r, 150));
  }
}

}
function bindApply(root, btnSel, label) {
  const btn = root.querySelector(btnSel);
  const upd = () => { const n = root.querySelectorAll('.prev input[type=checkbox]:checked').length; btn.textContent = label(n); btn.disabled = !n; };
  root.addEventListener('change', upd); upd();
  return () => Array.from(root.querySelectorAll('.prev input[type=checkbox]:checked')).map(x => +x.getAttribute('data-i'));
}

    <div class="row2"><label class="field" style="flex:1"><span>조</span><select id="mTeam">${[1, 2, 3].map(n => `<option value="${n}" ${String(v.team) === String(n) ? 'selected' : ''}>${h(teamName(n, site))}</option>`).join('')}<option value="" ${teamNo(v) ? '' : 'selected'}>조 없음</option></select></label>
      <label class="field" style="flex:1"><span>조 직책</span><select id="mRole">${['계원', '반장', '조장'].map(r => `<option ${v.role === r ? 'selected' : ''}>${r}</option>`).join('')}</select></label></div>
    <label class="field"><span>모임 직함 (회장·총무 등, 선택)</span><input id="mTitle" value="${h(v.title)}" maxlength="30"></label>
    <label class="field"><span>휴대폰</span><input id="mPhone" type="tel" inputmode="tel" value="${h(v.phone)}" placeholder="010-0000-0000"></label>
    <p class="hint">번호를 넣으면 이 회원은 회신할 때 번호 뒷 4자리로 본인 확인을 합니다.</p>
    ${vacctMode() || v.vacct ? `<label class="field"><span>전용 입금 계좌 (가상계좌 번호)</span><input id="mVacct" inputmode="numeric" value="${h(v.vacct || '')}" placeholder="예: 562-912345-10001" maxlength="30"></label>
    <p class="hint">이 계좌로 들어온 돈은 입금자 이름이 달라도 이 회원의 회비로 확인됩니다.</p>` : ''}
    <label class="field"><span>메모</span><input id="mMemo" value="${h(v.memo)}" maxlength="200"></label>
    <label class="field"><span>상태</span><select id="mStatus">${['활동', '휴면', '탈퇴'].map(st => `<option ${(v.status || '활동') === st ? 'selected' : ''}>${st}</option>`).join('')}</select></label>
    <div class="err" id="mErr"></div>`, { foot: `<button class="btn primary" style="flex:1" id="mSave">저장</button>${isNew ? '' : '<button class="btn danger" id="mDel">삭제</button>'}` });
  sh.querySelector('#mSave').onclick = async e => {
    const btn = e.currentTarget;
    const o = { id: isNew ? '' : v.id, name: val(sh, '#mName'), team: val(sh, '#mTeam'), role: val(sh, '#mRole'), title: val(sh, '#mTitle'), phone: val(sh, '#mPhone'), memo: val(sh, '#mMemo'), status: val(sh, '#mStatus') };
    if (sh.querySelector('#mVacct')) o.vacct = val(sh, '#mVacct');   // 칸이 없으면 기존 계좌를 건드리지 않음
    if (!o.name.trim()) { sh.querySelector('#mErr').textContent = '이름을 넣어 주세요.'; return; }
    btn.disabled = true; btn.textContent = '저장 중…';
    try {
      const saved = await api('adm_saveMember', S.token, o);
      S.D.members = sortMembers(S.D.members.filter(x => x.id !== saved.id).concat([saved])); index();
      closeSheet(); refreshMemList(); toast('저장했어요');
    } catch (err) {
      if (isAuth(err)) { handleErr(err); return; }
      sh.querySelector('#mErr').textContent = errMsg(err); btn.disabled = false; btn.textContent = '저장';
    }
  };
  const del = sh.querySelector('#mDel');
  if (del) del.onclick = async () => {
    if (!window.confirm(`${v.name} 님을 명단에서 삭제할까요?\n지난 행사 기록의 이름은 남고, 다음 행사부터 회신 명단에서 빠집니다. 잠시 쉬는 분은 상태를 '휴면'으로 바꾸는 편이 좋습니다.`)) return;
    try {
      await api('adm_deleteMember', S.token, v.id);
      S.D.members = S.D.members.filter(x => x.id !== v.id); index();
      closeSheet(); refreshMemList(); toast('삭제했어요');
    } catch (err) { handleErr(err); }
  };
}

  const sh = openSheet('연락처 붙여넣기', `<p class="hint">'이름 010-1234-5678'처럼 한 줄에 한 명씩 붙여 넣으세요. 엑셀·카톡에서 복사한 명단도 됩니다.</p>
    <textarea class="tpl-ta" id="cTa" rows="8" placeholder="김진호 010-1234-5678&#10;하주희 010-2345-6789"></textarea>
    <button class="btn primary block" id="cGo">이름 찾기</button><div id="cOut"></div>`);
  sh.querySelector('#cGo').onclick = () => {
    const r = parseContacts(sh.querySelector('#cTa').value, S.D.members);
    const out = sh.querySelector('#cOut');

    r.items.forEach(it => { it.cur = it.m.phone || ''; it.checked = it.cur.replace(/\D/g, '') !== it.phone.replace(/\D/g, ''); });
    out.innerHTML = previewRows(r.items, it => `<b>${h(it.m.name)}</b> <small class="muted">${h(teamName(teamNo(it.m), S.D.site))}</small><br>${it.cur ? h(it.cur) + ' → ' : ''}<b>${h(it.phone)}</b>${it.checked ? '' : ' <small class="muted">(이미 같음)</small>'}`)
      + (r.unknown.length ? `<p class="hint" style="margin-top:10px">이름이 명단과 맞지 않는 줄 ${r.unknown.length}개: ${h(r.unknown.slice(0, 3).join(' / '))}</p>` : '')
      + '<button class="btn primary block" id="cApply" style="margin-top:12px">반영</button>';

    out.querySelector('#cApply').onclick = async e => {
      const list = picked().map(i => ({ id: r.items[i].m.id, phone: r.items[i].phone }));
      e.currentTarget.disabled = true; e.currentTarget.textContent = '저장 중…';
      try {
        S.D.members = await api('adm_saveContacts', S.token, list); index();
        closeSheet(); refreshMemList(); toast(`${list.length}명 연락처를 저장했어요`);
      } catch (err) { handleErr(err); }
